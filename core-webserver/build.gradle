plugins {
    id 'java'
}

group 'de.dfki.vsm'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url "https://repo.spring.io/libs-release" }
}

dependencies {
    implementation project(':core')
    implementation project(':core-http-jdk')

    implementation group: 'io.javalin', name: 'javalin', version: '6.7.0'
    implementation group: 'org.reflections', name: 'reflections', version: '0.9.12'
    implementation group: 'org.javassist', name: 'javassist', version: '3.30.2-GA'
    implementation group: 'org.json', name: 'json', version: '20240303'
    implementation group: 'com.nimbusds', name: 'nimbus-jose-jwt', version: '9.40'

    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '5.3.2'
    testRuntimeOnly group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '5.3.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.3.2'
}

// The pattern catalogue and the semantic-rule mapping are authored in doc/ and read at runtime by
// the SceneFlow IR pipeline, which no longer runs from the repository root now that it lives here.
// Copying them onto the classpath keeps doc/ authoritative instead of forking a second copy.
processResources {
    from(rootProject.file('doc')) {
        include 'interactive-design-pattern-catalog.json'
        include 'meta-to-sceneflow-mapping.json'
        into 'sceneflow'
    }
}

test {
    useJUnitPlatform()
}

def webUiSourceDir = rootProject.file("editor/src/main/resources/web-ui")
def webUiTargetDir = file("src/main/resources/web-ui")

tasks.register("syncWebUi", Sync) {
    dependsOn project(":editor").tasks.named("webUiBuild")
    from(webUiSourceDir)
    into(webUiTargetDir)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    onlyIf { webUiSourceDir.exists() }
}

processResources.dependsOn tasks.named("syncWebUi")
