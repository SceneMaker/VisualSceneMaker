plugins {
    id 'java'
}

group 'de.dfki.vsm'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url "https://repo.spring.io/libs-release" }
}

dependencies {
    implementation project(':core')
    implementation project(':core-http-jdk')

    implementation group: 'io.javalin', name: 'javalin', version: '6.7.0'
    implementation group: 'org.reflections', name: 'reflections', version: '0.9.12'
    implementation group: 'org.json', name: 'json', version: '20240303'

    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '5.3.2'
    testRuntimeOnly group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '5.3.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.3.2'
}

test {
    useJUnitPlatform()
}

def webUiSourceDir = rootProject.file("editor/src/main/resources/web-ui")
def webUiTargetDir = file("src/main/resources/web-ui")

tasks.register("syncWebUi", Sync) {
    dependsOn project(":editor").tasks.named("webUiBuild")
    from(webUiSourceDir)
    into(webUiTargetDir)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    onlyIf { webUiSourceDir.exists() }
}

processResources.dependsOn tasks.named("syncWebUi")
