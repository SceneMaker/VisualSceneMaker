<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Screen Preview</title>

    <!-- Shoelace component library -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.19.1/cdn/themes/light.css">
    <script type="module"
            src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.19.1/cdn/shoelace.js"></script>

    <!-- Chart.js (UMD build — exposes window.Chart) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>

    <!-- VSM schema-driven renderer -->
    <script type="module" src="/web-ui/vsm-renderer.js"></script>

    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
        #preview-character {
            position: fixed; left: 0; top: 0; z-index: 0;
            width: 100%; height: 100%; border: none;
        }
        vsm-screen-renderer {
            position: fixed; left: 0; top: 0; z-index: 1;
            width: 100%; height: 100%; display: block;
        }
    </style>

    <script>
        // Resolve the schema from the REST API so the renderer works without
        // the plugin runtime server being active.
        window.__VSM_PREVIEW_MODE = true;   // suppresses character iframe + audio overlay

        // Assets base URL: redirects /assets/x to the project-specific REST endpoint.
        const _pid = new URLSearchParams(location.search).get('project');
        window.__VSM_ASSETS_BASE = _pid ? `/api/v1/projects/${_pid}/assets` : null;

        window.__VSM_SCHEMA_READY = (async () => {
            const params = new URLSearchParams(location.search);
            const pid    = params.get('project');
            if (!pid) return null;
            try {
                const r = await fetch('/api/v1/projects/' + pid + '/screens');
                if (!r.ok) return null;
                return await r.json();
            } catch (e) {
                console.error('[screens-preview] Failed to load screens:', e);
                return null;
            }
        })();
    </script>
</head>
<body>
    <script>
        // Inject character iframe behind the renderer when the 'character' query param is set.
        (function() {
            var charUrl = new URLSearchParams(location.search).get('character');
            if (charUrl) {
                var f = document.createElement('iframe');
                f.id = 'preview-character';
                f.src = charUrl;
                f.allow = 'autoplay';
                document.currentScript.parentNode.insertBefore(f, document.currentScript);
            }
        })();
    </script>
    <vsm-screen-renderer></vsm-screen-renderer>
</body>
</html>
