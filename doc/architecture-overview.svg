<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="1100" height="820">
  <defs>
    <style>
      .bg        { fill: #fafafa; }
      .zone      { rx: 12; stroke-width: 2; }
      .zone-core { fill: #e8f0fe; stroke: #4285f4; }
      .zone-edit { fill: #fef7e0; stroke: #f9ab00; }
      .zone-rt   { fill: #e6f4ea; stroke: #34a853; }
      .zone-plug { fill: #fce8e6; stroke: #ea4335; }
      .zone-ui   { fill: #f3e8fd; stroke: #a142f4; }
      .box       { fill: #fff; rx: 6; stroke-width: 1.5; }
      .box-core  { stroke: #4285f4; }
      .box-edit  { stroke: #f9ab00; }
      .box-rt    { stroke: #34a853; }
      .box-plug  { stroke: #ea4335; }
      .box-ui    { stroke: #a142f4; }
      .box-mode  { stroke: #5f6368; stroke-dasharray: 4,3; fill: #f8f9fa; }
      .title     { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; fill: #202124; }
      .t-lg      { font-size: 20px; }
      .t-md      { font-size: 13px; }
      .t-sm      { font-size: 11px; }
      .t-xs      { font-size: 9.5px; }
      .muted     { fill: #5f6368; }
      .accent-b  { fill: #4285f4; }
      .accent-g  { fill: #34a853; }
      .accent-o  { fill: #f9ab00; }
      .accent-r  { fill: #ea4335; }
      .accent-p  { fill: #a142f4; }
      .line      { stroke-width: 1.8; fill: none; }
      .l-data    { stroke: #4285f4; }
      .l-event   { stroke: #a142f4; stroke-dasharray: 6,3; }
      .l-ws      { stroke: #34a853; }
      .l-plug    { stroke: #ea4335; }
      .l-mode    { stroke: #5f6368; stroke-dasharray: 3,3; }
      .arr       { stroke: none; }
      .tag       { rx: 3; }
      .tag-full  { fill: #f9ab00; }
      .tag-rt    { fill: #34a853; }
      .tag-both  { fill: #e8eaed; }
    </style>
    <marker id="a-b" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#4285f4"/>
    </marker>
    <marker id="a-g" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#34a853"/>
    </marker>
    <marker id="a-p" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#a142f4"/>
    </marker>
    <marker id="a-r" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#ea4335"/>
    </marker>
    <marker id="a-gray" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#5f6368"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="820" class="bg"/>

  <!-- Title -->
  <text x="550" y="32" text-anchor="middle" class="title t-lg">VisualSceneMaker — Unified Server Architecture</text>
  <text x="550" y="50" text-anchor="middle" class="t-sm muted">Dual-mode WebUiServer · Java 17 Core · Event-driven · 24+ Plugins</text>

  <!-- ═══════════════ WEB UI (top) ═══════════════ -->
  <rect x="30" y="68" width="1040" height="110" class="zone zone-ui"/>
  <text x="50" y="90" class="title t-md accent-p">Web UI  (Svelte + Vite)</text>

  <rect x="50" y="100" width="130" height="58" class="box box-ui"/>
  <text x="115" y="120" text-anchor="middle" class="title t-sm">App.svelte</text>
  <text x="115" y="135" text-anchor="middle" class="t-xs muted">Root / WS client</text>
  <text x="115" y="148" text-anchor="middle" class="t-xs muted">Remote connect</text>

  <rect x="200" y="100" width="130" height="58" class="box box-ui"/>
  <text x="265" y="120" text-anchor="middle" class="title t-sm">SceneFlowView</text>
  <text x="265" y="135" text-anchor="middle" class="t-xs muted">SVG graph editor</text>

  <rect x="350" y="100" width="130" height="58" class="box box-ui"/>
  <text x="415" y="120" text-anchor="middle" class="title t-sm">ScriptEditor</text>
  <text x="415" y="135" text-anchor="middle" class="t-xs muted">CodeMirror</text>

  <rect x="510" y="100" width="150" height="58" class="box box-ui"/>
  <text x="585" y="120" text-anchor="middle" class="title t-sm">Runtime Panel</text>
  <text x="585" y="135" text-anchor="middle" class="t-xs muted">Variables, controls</text>

  <rect x="690" y="100" width="150" height="58" class="box box-ui"/>
  <text x="765" y="120" text-anchor="middle" class="title t-sm">Config Panels</text>
  <text x="765" y="135" text-anchor="middle" class="t-xs muted">Project, plugins, agents</text>

  <!-- Browser label -->
  <rect x="885" y="108" width="160" height="42" class="box box-ui"/>
  <text x="965" y="128" text-anchor="middle" class="t-xs muted">Any modern browser</text>
  <text x="965" y="142" text-anchor="middle" class="t-xs muted">Local or remote</text>

  <!-- ═══════════ UNIFIED SERVER (middle) ═══════════ -->
  <rect x="30" y="198" width="1040" height="290" class="zone zone-core"/>
  <text x="50" y="222" class="title t-md accent-b">WebUiServer  (core module · Java 17 · Javalin)</text>

  <!-- Mode indicator -->
  <rect x="405" y="208" width="200" height="20" class="box-mode" style="fill:#f1f3f4"/>
  <text x="505" y="222" text-anchor="middle" class="title t-xs">ServerMode  enum</text>
  <rect x="620" y="208" width="95" height="20" class="tag tag-full" rx="3"/>
  <text x="668" y="222" text-anchor="middle" class="t-xs" style="fill:#fff;font-weight:600">FULL_EDITOR</text>
  <rect x="720" y="208" width="105" height="20" class="tag tag-rt" rx="3"/>
  <text x="773" y="222" text-anchor="middle" class="t-xs" style="fill:#fff;font-weight:600">RUNTIME_ONLY</text>

  <!-- REST / WS layer -->
  <rect x="50" y="238" width="310" height="70" class="box box-core"/>
  <text x="205" y="258" text-anchor="middle" class="title t-sm">REST  /api/v1/*</text>
  <text x="205" y="273" text-anchor="middle" class="t-xs muted">/projects, /info, /token, /preferences</text>
  <text x="205" y="286" text-anchor="middle" class="t-xs muted">/projects/{pid}/sceneflow, /runtime, /script</text>
  <rect x="280" y="292" width="60" height="14" class="tag tag-both" rx="2"/>
  <text x="310" y="302" text-anchor="middle" class="t-xs">both</text>

  <rect x="380" y="238" width="310" height="70" class="box box-core"/>
  <text x="535" y="258" text-anchor="middle" class="title t-sm">WebSocket  /ws</text>
  <text x="535" y="273" text-anchor="middle" class="t-xs muted">SceneFlow.Get, Runtime.Play/Pause/Stop</text>
  <text x="535" y="286" text-anchor="middle" class="t-xs muted">Runtime.Variable.Set, Runtime.Query</text>
  <rect x="610" y="292" width="60" height="14" class="tag tag-both" rx="2"/>
  <text x="640" y="302" text-anchor="middle" class="t-xs">both</text>

  <rect x="710" y="238" width="170" height="70" class="box box-edit"/>
  <text x="795" y="258" text-anchor="middle" class="title t-sm accent-o">Editor-Only</text>
  <text x="795" y="273" text-anchor="middle" class="t-xs muted">Node/Edge/Comment CRUD</text>
  <text x="795" y="286" text-anchor="middle" class="t-xs muted">Undo/Redo, Script.Update</text>
  <rect x="830" y="292" width="40" height="14" class="tag tag-full" rx="2"/>
  <text x="850" y="302" text-anchor="middle" class="t-xs" style="fill:#fff;font-weight:600">FE</text>

  <rect x="900" y="238" width="150" height="70" class="box box-rt"/>
  <text x="975" y="258" text-anchor="middle" class="title t-sm accent-g">Runtime REST</text>
  <text x="975" y="273" text-anchor="middle" class="t-xs muted">/runtime/load, /start</text>
  <text x="975" y="286" text-anchor="middle" class="t-xs muted">/stop, /pause, /status</text>
  <rect x="1000" y="292" width="40" height="14" class="tag tag-rt" rx="2"/>
  <text x="1020" y="302" text-anchor="middle" class="t-xs" style="fill:#fff;font-weight:600">RO</text>

  <!-- Internal services row -->
  <rect x="50" y="324" width="200" height="60" class="box box-core"/>
  <text x="150" y="345" text-anchor="middle" class="title t-sm">EventListener</text>
  <text x="150" y="360" text-anchor="middle" class="t-xs muted">Translates domain events</text>
  <text x="150" y="372" text-anchor="middle" class="t-xs muted">→ WS broadcasts to clients</text>

  <rect x="270" y="324" width="200" height="60" class="box box-core"/>
  <text x="370" y="345" text-anchor="middle" class="title t-sm">SnapshotBuilder</text>
  <text x="370" y="360" text-anchor="middle" class="t-xs muted">SceneFlow → JSON</text>
  <text x="370" y="372" text-anchor="middle" class="t-xs muted">Shared by both modes</text>

  <rect x="490" y="324" width="200" height="60" class="box box-core"/>
  <text x="590" y="345" text-anchor="middle" class="title t-sm">EdgeLayoutService</text>
  <text x="590" y="360" text-anchor="middle" class="t-xs muted">Dock points, normalize</text>
  <text x="590" y="372" text-anchor="middle" class="t-xs muted">Straighten edges</text>

  <rect x="710" y="324" width="200" height="60" class="box box-core"/>
  <text x="810" y="345" text-anchor="middle" class="title t-sm">ProjectRef Store</text>
  <text x="810" y="360" text-anchor="middle" class="t-xs muted">In-memory project cache</text>
  <text x="810" y="372" text-anchor="middle" class="t-xs muted">History, undo/redo</text>

  <rect x="930" y="324" width="120" height="60" class="box box-core"/>
  <text x="990" y="345" text-anchor="middle" class="title t-sm">Auth</text>
  <text x="990" y="360" text-anchor="middle" class="t-xs muted">Token-based</text>
  <text x="990" y="372" text-anchor="middle" class="t-xs muted">Auto-generated</text>

  <!-- Dispatch label -->
  <rect x="50" y="400" width="1000" height="30" class="box box-core" style="fill:#e8f0fe"/>
  <text x="550" y="420" text-anchor="middle" class="title t-sm">dispatchWs()  — mode gate:  isEditingCommand() → reject in RUNTIME_ONLY</text>

  <!-- loadProject / startRuntime -->
  <rect x="50" y="445" width="230" height="30" class="box box-core" style="fill:#e8f0fe"/>
  <text x="165" y="465" text-anchor="middle" class="t-sm accent-b" style="font-weight:600">loadProject() · startRuntime()</text>

  <!-- ═══════════ RUNTIME ENGINE (bottom-left) ═══════════ -->
  <rect x="30" y="500" width="530" height="130" class="zone zone-rt"/>
  <text x="50" y="522" class="title t-md accent-g">Runtime Engine  (core module · Java 17)</text>

  <rect x="50" y="535" width="135" height="78" class="box box-rt"/>
  <text x="118" y="555" text-anchor="middle" class="title t-sm">RunTimeProject</text>
  <text x="118" y="570" text-anchor="middle" class="t-xs muted">launch / start</text>
  <text x="118" y="583" text-anchor="middle" class="t-xs muted">abort / unload</text>
  <text x="118" y="596" text-anchor="middle" class="t-xs muted">parse XML</text>

  <rect x="200" y="535" width="115" height="78" class="box box-rt"/>
  <text x="258" y="555" text-anchor="middle" class="title t-sm">Interpreter</text>
  <text x="258" y="570" text-anchor="middle" class="t-xs muted">State machine</text>
  <text x="258" y="583" text-anchor="middle" class="t-xs muted">ReentrantLock</text>
  <text x="258" y="596" text-anchor="middle" class="t-xs muted">Thread</text>

  <rect x="330" y="535" width="100" height="78" class="box box-rt"/>
  <text x="380" y="555" text-anchor="middle" class="title t-sm">Evaluator</text>
  <text x="380" y="570" text-anchor="middle" class="t-xs muted">Expressions</text>
  <text x="380" y="583" text-anchor="middle" class="t-xs muted">Environment</text>

  <rect x="445" y="535" width="100" height="78" class="box box-rt"/>
  <text x="495" y="555" text-anchor="middle" class="title t-sm">Activities</text>
  <text x="495" y="570" text-anchor="middle" class="t-xs muted">Scheduler</text>
  <text x="495" y="583" text-anchor="middle" class="t-xs muted">Workers</text>
  <text x="495" y="596" text-anchor="middle" class="t-xs muted">Actions</text>

  <!-- ═══════════ PLUGINS (bottom-right) ═══════════ -->
  <rect x="580" y="500" width="490" height="130" class="zone zone-plug"/>
  <text x="600" y="522" class="title t-md accent-r">Plugins  (24 modules · Java 17)</text>

  <rect x="600" y="535" width="110" height="35" class="box box-plug"/>
  <text x="655" y="557" text-anchor="middle" class="t-xs">charamel-ws</text>

  <rect x="720" y="535" width="100" height="35" class="box box-plug"/>
  <text x="770" y="557" text-anchor="middle" class="t-xs">htmlgui-ws</text>

  <rect x="830" y="535" width="80" height="35" class="box box-plug"/>
  <text x="870" y="557" text-anchor="middle" class="t-xs">unity</text>

  <rect x="920" y="535" width="80" height="35" class="box box-plug"/>
  <text x="960" y="557" text-anchor="middle" class="t-xs">console</text>

  <rect x="600" y="580" width="80" height="35" class="box box-plug"/>
  <text x="640" y="602" text-anchor="middle" class="t-xs">timer</text>

  <rect x="690" y="580" width="80" height="35" class="box box-plug"/>
  <text x="730" y="602" text-anchor="middle" class="t-xs">ssi / ssj</text>

  <rect x="780" y="580" width="80" height="35" class="box box-plug"/>
  <text x="820" y="602" text-anchor="middle" class="t-xs">wizard</text>

  <rect x="870" y="580" width="80" height="35" class="box box-plug"/>
  <text x="910" y="602" text-anchor="middle" class="t-xs">email</text>

  <rect x="960" y="580" width="100" height="35" class="box box-plug"/>
  <text x="1010" y="602" text-anchor="middle" class="t-xs">16 more...</text>

  <!-- ═══════════ MODEL (bottom strip) ═══════════ -->
  <rect x="30" y="648" width="1040" height="55" class="zone" style="fill:#f1f3f4; stroke:#9aa0a6;"/>
  <text x="50" y="670" class="title t-md muted">Model  (core/model · pure POJOs · XML serialization)</text>
  <rect x="300" y="660" width="120" height="30" class="box" style="stroke:#9aa0a6"/>
  <text x="360" y="680" text-anchor="middle" class="t-xs">SceneFlow</text>
  <rect x="440" y="660" width="120" height="30" class="box" style="stroke:#9aa0a6"/>
  <text x="500" y="680" text-anchor="middle" class="t-xs">SceneScript</text>
  <rect x="580" y="660" width="120" height="30" class="box" style="stroke:#9aa0a6"/>
  <text x="640" y="680" text-anchor="middle" class="t-xs">ProjectConfig</text>
  <rect x="720" y="660" width="100" height="30" class="box" style="stroke:#9aa0a6"/>
  <text x="770" y="680" text-anchor="middle" class="t-xs">Glue lang</text>
  <rect x="840" y="660" width="100" height="30" class="box" style="stroke:#9aa0a6"/>
  <text x="890" y="680" text-anchor="middle" class="t-xs">Graphics</text>

  <!-- ═══════════ ENTRY POINTS (bottom) ═══════════ -->
  <rect x="30" y="718" width="1040" height="90" class="zone" style="fill:#fff; stroke:#dadce0;"/>
  <text x="50" y="740" class="title t-md muted">Entry Points</text>

  <rect x="50" y="752" width="200" height="42" class="box box-edit"/>
  <text x="150" y="770" text-anchor="middle" class="title t-sm accent-o">SceneMaker3 / 4</text>
  <text x="150" y="785" text-anchor="middle" class="t-xs muted">FULL_EDITOR mode</text>

  <rect x="280" y="752" width="200" height="42" class="box box-rt"/>
  <text x="380" y="770" text-anchor="middle" class="title t-sm accent-g">RuntimeMain</text>
  <text x="380" y="785" text-anchor="middle" class="t-xs muted">RUNTIME_ONLY mode</text>

  <rect x="510" y="752" width="200" height="42" class="box" style="stroke:#9aa0a6"/>
  <text x="610" y="770" text-anchor="middle" class="title t-sm muted">Core.runtime()</text>
  <text x="610" y="785" text-anchor="middle" class="t-xs muted">Headless (no server)</text>

  <!-- Legend -->
  <rect x="770" y="742" width="280" height="55" rx="6" style="fill:#fff;stroke:#dadce0;stroke-width:1"/>
  <rect x="785" y="752" width="35" height="12" class="tag tag-full" rx="2"/>
  <text x="830" y="762" class="t-xs">FULL_EDITOR only</text>
  <rect x="785" y="770" width="35" height="12" class="tag tag-rt" rx="2"/>
  <text x="830" y="780" class="t-xs">RUNTIME_ONLY only</text>
  <line x1="910" y1="756" x2="950" y2="756" class="line l-event"/>
  <text x="960" y="760" class="t-xs">Events</text>
  <line x1="910" y1="774" x2="950" y2="774" class="line l-ws"/>
  <text x="960" y="778" class="t-xs">WS / REST</text>

  <!-- ═══════════ ARROWS ═══════════ -->

  <!-- Web UI → WebUiServer (WS + REST) -->
  <path d="M 115 158 L 115 175 L 205 175 L 205 238" class="line l-ws" marker-end="url(#a-g)"/>
  <path d="M 585 158 L 585 175 L 535 175 L 535 238" class="line l-ws" marker-end="url(#a-g)"/>
  <text x="420" y="188" text-anchor="middle" class="t-xs accent-g" style="font-weight:600">HTTP / WebSocket</text>

  <!-- WebUiServer → Runtime Engine -->
  <path d="M 165 475 L 165 500" class="line l-data" marker-end="url(#a-b)"/>

  <!-- Runtime → EventDispatcher → WebUiServer broadcast -->
  <path d="M 258 535 L 258 500 L 30 500 L 30 354 L 50 354" class="line l-event" marker-end="url(#a-p)"/>
  <text x="20" y="440" class="t-xs accent-p" transform="rotate(-90 20 440)" style="font-weight:600">Events</text>

  <!-- Runtime → Plugins -->
  <path d="M 545 574 L 580 574" class="line l-plug" marker-end="url(#a-r)"/>

  <!-- Runtime → Model -->
  <path d="M 118 613 L 118 648" class="line l-data" marker-end="url(#a-b)"/>

  <!-- Entry Points → Server -->
  <path d="M 150 752 L 150 490 L 165 490 L 165 475" class="line l-mode" marker-end="url(#a-gray)"/>
  <path d="M 380 752 L 380 490 L 200 490 L 200 475" class="line l-mode" marker-end="url(#a-gray)"/>

</svg>
