<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" width="1280" height="920">
  <title>VisualSceneMaker Architecture Overview (February 2026)</title>
  <desc>Current architecture with SceneMaker4 full-editor mode, RuntimeMain runtime-only mode, core-webserver, Android runtime transport, and optional semantic services.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .zone { rx: 12; stroke-width: 2; }
      .z-clients { fill: #eef4ff; stroke: #3b82f6; }
      .z-launch { fill: #fff7e8; stroke: #f59e0b; }
      .z-server { fill: #ecfdf3; stroke: #16a34a; }
      .z-runtime { fill: #eef2ff; stroke: #6366f1; }
      .z-services { fill: #fef2f2; stroke: #ef4444; }
      .z-model { fill: #f3f4f6; stroke: #9ca3af; }
      .box { fill: #ffffff; rx: 7; stroke-width: 1.4; }
      .b-blue { stroke: #3b82f6; }
      .b-amber { stroke: #f59e0b; }
      .b-green { stroke: #16a34a; }
      .b-indigo { stroke: #6366f1; }
      .b-red { stroke: #ef4444; }
      .b-gray { stroke: #9ca3af; }
      .mode { fill: #f9fafb; stroke: #6b7280; stroke-dasharray: 4,3; rx: 4; }
      .title { font-family: "Segoe UI", Arial, sans-serif; font-weight: 700; fill: #111827; }
      .t-lg { font-size: 24px; }
      .t-md { font-size: 14px; }
      .t-sm { font-size: 12px; }
      .t-xs { font-size: 10px; }
      .muted { fill: #4b5563; }
      .line { fill: none; stroke-width: 2; }
      .l-http { stroke: #16a34a; }
      .l-data { stroke: #3b82f6; }
      .l-event { stroke: #8b5cf6; stroke-dasharray: 6,3; }
      .l-plugin { stroke: #ef4444; }
      .l-mode { stroke: #6b7280; stroke-dasharray: 4,3; }
      .chip { rx: 3; }
      .chip-fe { fill: #f59e0b; }
      .chip-ro { fill: #16a34a; }
      .chip-both { fill: #e5e7eb; }
    </style>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#16a34a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#3b82f6"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#8b5cf6"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#ef4444"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1280" height="920" class="bg"/>

  <text x="640" y="36" text-anchor="middle" class="title t-lg">VisualSceneMaker Architecture Overview (Feb 2026)</text>
  <text x="640" y="56" text-anchor="middle" class="t-sm muted">Web-v1.0 stack · SceneMaker4 full-editor mode · RuntimeMain runtime-only mode · Android transport split</text>

  <!-- Clients -->
  <rect x="24" y="76" width="1232" height="126" class="zone z-clients"/>
  <text x="44" y="100" class="title t-md" fill="#1d4ed8">Client Surfaces</text>

  <rect x="44" y="112" width="210" height="72" class="box b-blue"/>
  <text x="149" y="132" text-anchor="middle" class="title t-sm">Browser UI</text>
  <text x="149" y="147" text-anchor="middle" class="t-xs muted">editor/web-ui (Svelte)</text>
  <text x="149" y="160" text-anchor="middle" class="t-xs muted">SceneFlowView, ScriptEditor</text>
  <text x="149" y="173" text-anchor="middle" class="t-xs muted">WS + REST client</text>

  <rect x="274" y="112" width="240" height="72" class="box b-blue"/>
  <text x="394" y="132" text-anchor="middle" class="title t-sm">Remote Runtime Client</text>
  <text x="394" y="147" text-anchor="middle" class="t-xs muted">Connects to RuntimeMain server</text>
  <text x="394" y="160" text-anchor="middle" class="t-xs muted">Runtime controls + monitoring</text>
  <text x="394" y="173" text-anchor="middle" class="t-xs muted">Token-auth capable</text>

  <rect x="534" y="112" width="260" height="72" class="box b-blue"/>
  <text x="664" y="132" text-anchor="middle" class="title t-sm">Android Stub App</text>
  <text x="664" y="147" text-anchor="middle" class="t-xs muted">android-stub (API 26+)</text>
  <text x="664" y="160" text-anchor="middle" class="t-xs muted">Runs CoreRuntime + AndroidRuntimeServer</text>
  <text x="664" y="173" text-anchor="middle" class="t-xs muted">Local device/emulator loop</text>

  <rect x="814" y="112" width="422" height="72" class="box b-blue"/>
  <text x="1025" y="132" text-anchor="middle" class="title t-sm">Semantic/AI-Backed UX (Optional)</text>
  <text x="1025" y="147" text-anchor="middle" class="t-xs muted">Embeddings health + similarity requests from App.svelte</text>
  <text x="1025" y="160" text-anchor="middle" class="t-xs muted">UD syntax endpoint for semantic annotations</text>
  <text x="1025" y="173" text-anchor="middle" class="t-xs muted">Auto-start hooks for local services</text>

  <!-- Launchers -->
  <rect x="24" y="218" width="300" height="306" class="zone z-launch"/>
  <text x="44" y="242" class="title t-md" fill="#b45309">Launchers and Execution Modes</text>

  <rect x="44" y="255" width="260" height="76" class="box b-amber"/>
  <text x="174" y="275" text-anchor="middle" class="title t-sm">SceneMaker4</text>
  <text x="174" y="290" text-anchor="middle" class="t-xs muted">src/main/java/de/dfki/vsm/SceneMaker4.java</text>
  <text x="174" y="303" text-anchor="middle" class="t-xs muted">Starts WebUiServer in FULL_EDITOR</text>
  <text x="174" y="316" text-anchor="middle" class="t-xs muted">Flags: --allow-lan, --no-browser</text>

  <rect x="44" y="345" width="260" height="76" class="box b-amber"/>
  <text x="174" y="365" text-anchor="middle" class="title t-sm">RuntimeMain</text>
  <text x="174" y="380" text-anchor="middle" class="t-xs muted">runtime-server/.../RuntimeMain.java</text>
  <text x="174" y="393" text-anchor="middle" class="t-xs muted">Starts WebUiServer in RUNTIME_ONLY</text>
  <text x="174" y="406" text-anchor="middle" class="t-xs muted">--port --project --autostart --token</text>

  <rect x="44" y="435" width="260" height="76" class="box b-amber"/>
  <text x="174" y="455" text-anchor="middle" class="title t-sm">Core.runtime(path)</text>
  <text x="174" y="470" text-anchor="middle" class="t-xs muted">Headless compatibility path</text>
  <text x="174" y="483" text-anchor="middle" class="t-xs muted">Used without WebUiServer surface</text>
  <text x="174" y="496" text-anchor="middle" class="t-xs muted">for direct runtime execution</text>

  <!-- Server -->
  <rect x="340" y="218" width="916" height="306" class="zone z-server"/>
  <text x="360" y="242" class="title t-md" fill="#166534">Unified Web Server Layer</text>
  <text x="360" y="258" class="t-sm muted">core-webserver/src/main/java/de/dfki/vsm/web/WebUiServer.java</text>

  <rect x="690" y="232" width="220" height="20" class="mode"/>
  <text x="800" y="246" text-anchor="middle" class="t-xs muted" style="font-weight:600">ServerMode enum</text>
  <rect x="920" y="232" width="80" height="20" class="chip chip-fe"/>
  <text x="960" y="246" text-anchor="middle" class="t-xs" style="fill:#fff;font-weight:700">FULL_EDITOR</text>
  <rect x="1008" y="232" width="92" height="20" class="chip chip-ro"/>
  <text x="1054" y="246" text-anchor="middle" class="t-xs" style="fill:#fff;font-weight:700">RUNTIME_ONLY</text>

  <rect x="360" y="272" width="286" height="78" class="box b-green"/>
  <text x="503" y="294" text-anchor="middle" class="title t-sm">REST API (/api/v1)</text>
  <text x="503" y="309" text-anchor="middle" class="t-xs muted">info, token, projects, runtime state</text>
  <text x="503" y="322" text-anchor="middle" class="t-xs muted">semantic/syntax route, preferences</text>
  <rect x="594" y="332" width="42" height="14" class="chip chip-both"/>
  <text x="615" y="342" text-anchor="middle" class="t-xs">both</text>

  <rect x="662" y="272" width="286" height="78" class="box b-green"/>
  <text x="805" y="294" text-anchor="middle" class="title t-sm">WebSocket (/ws)</text>
  <text x="805" y="309" text-anchor="middle" class="t-xs muted">SceneFlow.Get, Runtime.*</text>
  <text x="805" y="322" text-anchor="middle" class="t-xs muted">editing commands gated by mode</text>
  <rect x="896" y="332" width="42" height="14" class="chip chip-both"/>
  <text x="917" y="342" text-anchor="middle" class="t-xs">both</text>

  <rect x="964" y="272" width="272" height="78" class="box b-green"/>
  <text x="1100" y="294" text-anchor="middle" class="title t-sm">Command Services</text>
  <text x="1100" y="309" text-anchor="middle" class="t-xs muted">Node/Edge/Comment CRUD, Script, Undo/Redo</text>
  <text x="1100" y="322" text-anchor="middle" class="t-xs muted">RuntimeCommandService + adapters</text>
  <rect x="1176" y="332" width="50" height="14" class="chip chip-fe"/>
  <text x="1201" y="342" text-anchor="middle" class="t-xs" style="fill:#fff;font-weight:700">FE</text>

  <rect x="360" y="366" width="200" height="62" class="box b-green"/>
  <text x="460" y="387" text-anchor="middle" class="title t-sm">ProjectRef Store</text>
  <text x="460" y="401" text-anchor="middle" class="t-xs muted">Open project map + history</text>
  <text x="460" y="414" text-anchor="middle" class="t-xs muted">Snapshot and script caches</text>

  <rect x="574" y="366" width="200" height="62" class="box b-green"/>
  <text x="674" y="387" text-anchor="middle" class="title t-sm">SceneFlowSnapshotBuilder</text>
  <text x="674" y="401" text-anchor="middle" class="t-xs muted">Graph JSON for UI and runtime API</text>
  <text x="674" y="414" text-anchor="middle" class="t-xs muted">Used across both modes</text>

  <rect x="788" y="366" width="200" height="62" class="box b-green"/>
  <text x="888" y="387" text-anchor="middle" class="title t-sm">Event Bridge</text>
  <text x="888" y="401" text-anchor="middle" class="t-xs muted">EventListener -> WS broadcast</text>
  <text x="888" y="414" text-anchor="middle" class="t-xs muted">Runtime updates + notifications</text>

  <rect x="1002" y="366" width="234" height="62" class="box b-green"/>
  <text x="1119" y="387" text-anchor="middle" class="title t-sm">Embeddings Process Control</text>
  <text x="1119" y="401" text-anchor="middle" class="t-xs muted">Health check and optional auto-start</text>
  <text x="1119" y="414" text-anchor="middle" class="t-xs muted">used by semantic suggestions</text>

  <rect x="360" y="440" width="876" height="68" class="box b-gray" style="fill:#f8fafc"/>
  <text x="798" y="460" text-anchor="middle" class="title t-sm">Mode Gates and Endpoints</text>
  <text x="798" y="474" text-anchor="middle" class="t-xs muted">FULL_EDITOR: project editing + creation APIs | RUNTIME_ONLY: runtime load/start/pause/resume/stop/unload</text>
  <text x="798" y="488" text-anchor="middle" class="t-xs muted">Editing WS methods rejected in RUNTIME_ONLY via command gate checks</text>
  <rect x="1155" y="491" width="44" height="13" class="chip chip-ro"/>
  <text x="1177" y="500" text-anchor="middle" class="t-xs" style="fill:#fff;font-weight:700">RO</text>

  <!-- Runtime and modules -->
  <rect x="24" y="540" width="760" height="224" class="zone z-runtime"/>
  <text x="44" y="564" class="title t-md" fill="#4338ca">Runtime and Module Split</text>

  <rect x="44" y="578" width="220" height="74" class="box b-indigo"/>
  <text x="154" y="598" text-anchor="middle" class="title t-sm">core (engine)</text>
  <text x="154" y="613" text-anchor="middle" class="t-xs muted">RunTimeProject, Interpreter, Evaluator</text>
  <text x="154" y="626" text-anchor="middle" class="t-xs muted">activity scheduler + worker pool</text>
  <text x="154" y="639" text-anchor="middle" class="t-xs muted">logic abstraction interfaces</text>

  <rect x="278" y="578" width="220" height="74" class="box b-indigo"/>
  <text x="388" y="598" text-anchor="middle" class="title t-sm">core-webserver</text>
  <text x="388" y="613" text-anchor="middle" class="t-xs muted">WebUiServer + command services</text>
  <text x="388" y="626" text-anchor="middle" class="t-xs muted">syncWebUi from editor resources</text>
  <text x="388" y="639" text-anchor="middle" class="t-xs muted">Javalin transport (desktop/server)</text>

  <rect x="512" y="578" width="252" height="74" class="box b-indigo"/>
  <text x="638" y="598" text-anchor="middle" class="title t-sm">runtime-server module</text>
  <text x="638" y="613" text-anchor="middle" class="t-xs muted">Main class: RuntimeMain</text>
  <text x="638" y="626" text-anchor="middle" class="t-xs muted">depends on core + core-webserver + core-logic-jpl</text>
  <text x="638" y="639" text-anchor="middle" class="t-xs muted">includes minimal plugin set (timer)</text>

  <rect x="44" y="668" width="220" height="74" class="box b-indigo"/>
  <text x="154" y="688" text-anchor="middle" class="title t-sm">core-http-jdk</text>
  <text x="154" y="703" text-anchor="middle" class="t-xs muted">JDK HTTP transport adapter</text>
  <text x="154" y="716" text-anchor="middle" class="t-xs muted">desktop/server network support</text>
  <text x="154" y="729" text-anchor="middle" class="t-xs muted">used by LLM/remote integrations</text>

  <rect x="278" y="668" width="220" height="74" class="box b-indigo"/>
  <text x="388" y="688" text-anchor="middle" class="title t-sm">core-http-android</text>
  <text x="388" y="703" text-anchor="middle" class="t-xs muted">NanoHTTPD + WebSocket transport</text>
  <text x="388" y="716" text-anchor="middle" class="t-xs muted">AndroidRuntimeServer + WS registry</text>
  <text x="388" y="729" text-anchor="middle" class="t-xs muted">portability-guarded APIs</text>

  <rect x="512" y="668" width="252" height="74" class="box b-indigo"/>
  <text x="638" y="688" text-anchor="middle" class="title t-sm">core-logic-jpl</text>
  <text x="638" y="703" text-anchor="middle" class="t-xs muted">JPL logic adapter module</text>
  <text x="638" y="716" text-anchor="middle" class="t-xs muted">separated from portable core</text>
  <text x="638" y="729" text-anchor="middle" class="t-xs muted">optional depending on runtime profile</text>

  <!-- Services and plugins -->
  <rect x="800" y="540" width="456" height="224" class="zone z-services"/>
  <text x="820" y="564" class="title t-md" fill="#b91c1c">Services and Extension Surface</text>

  <rect x="820" y="578" width="210" height="74" class="box b-red"/>
  <text x="925" y="598" text-anchor="middle" class="title t-sm">services:embeddings</text>
  <text x="925" y="613" text-anchor="middle" class="t-xs muted">local ONNX model service</text>
  <text x="925" y="626" text-anchor="middle" class="t-xs muted">semantic similarity endpoints</text>
  <text x="925" y="639" text-anchor="middle" class="t-xs muted">auto-start capable from WebUiServer</text>

  <rect x="1040" y="578" width="196" height="74" class="box b-red"/>
  <text x="1138" y="598" text-anchor="middle" class="title t-sm">services:semantic-ud</text>
  <text x="1138" y="613" text-anchor="middle" class="t-xs muted">Stanza-based syntax parsing</text>
  <text x="1138" y="626" text-anchor="middle" class="t-xs muted">drives semantic annotations</text>
  <text x="1138" y="639" text-anchor="middle" class="t-xs muted">default localhost:4061</text>

  <rect x="820" y="668" width="210" height="74" class="box b-red"/>
  <text x="925" y="688" text-anchor="middle" class="title t-sm">services:semantic-analysis</text>
  <text x="925" y="703" text-anchor="middle" class="t-xs muted">semantic processing utilities</text>
  <text x="925" y="716" text-anchor="middle" class="t-xs muted">integration support layer</text>
  <text x="925" y="729" text-anchor="middle" class="t-xs muted">used by editor workflows</text>

  <rect x="1040" y="668" width="196" height="74" class="box b-red"/>
  <text x="1138" y="688" text-anchor="middle" class="title t-sm">Plugins (20+ modules)</text>
  <text x="1138" y="703" text-anchor="middle" class="t-xs muted">timer, AndroidGui, yallah, voicetts, ...</text>
  <text x="1138" y="716" text-anchor="middle" class="t-xs muted">runtime-server ships minimal subset</text>
  <text x="1138" y="729" text-anchor="middle" class="t-xs muted">full app wires larger plugin set</text>

  <!-- Model strip -->
  <rect x="24" y="780" width="1232" height="60" class="zone z-model"/>
  <text x="44" y="804" class="title t-md muted">Domain Model (core/model, XML-backed)</text>
  <rect x="300" y="792" width="140" height="34" class="box b-gray"/>
  <text x="370" y="813" text-anchor="middle" class="t-sm">SceneFlow</text>
  <rect x="456" y="792" width="140" height="34" class="box b-gray"/>
  <text x="526" y="813" text-anchor="middle" class="t-sm">SceneScript</text>
  <rect x="612" y="792" width="150" height="34" class="box b-gray"/>
  <text x="687" y="813" text-anchor="middle" class="t-sm">ProjectConfig</text>
  <rect x="778" y="792" width="140" height="34" class="box b-gray"/>
  <text x="848" y="813" text-anchor="middle" class="t-sm">Glue Commands</text>
  <rect x="934" y="792" width="140" height="34" class="box b-gray"/>
  <text x="1004" y="813" text-anchor="middle" class="t-sm">Graphics Data</text>

  <!-- Legend -->
  <rect x="24" y="850" width="1232" height="50" rx="10" style="fill:#ffffff;stroke:#d1d5db;stroke-width:1.5"/>
  <text x="44" y="871" class="title t-sm muted">Legend</text>
  <line x1="120" y1="866" x2="160" y2="866" class="line l-http"/>
  <text x="168" y="870" class="t-xs muted">HTTP / WS requests</text>
  <line x1="290" y1="866" x2="330" y2="866" class="line l-data"/>
  <text x="338" y="870" class="t-xs muted">data / snapshots</text>
  <line x1="456" y1="866" x2="496" y2="866" class="line l-event"/>
  <text x="504" y="870" class="t-xs muted">runtime events</text>
  <line x1="606" y1="866" x2="646" y2="866" class="line l-plugin"/>
  <text x="654" y="870" class="t-xs muted">plugin/service integration</text>
  <rect x="852" y="858" width="46" height="14" class="chip chip-fe"/>
  <text x="875" y="869" text-anchor="middle" class="t-xs" style="fill:#fff;font-weight:700">FE</text>
  <text x="905" y="869" class="t-xs muted">FULL_EDITOR only</text>
  <rect x="1016" y="858" width="46" height="14" class="chip chip-ro"/>
  <text x="1039" y="869" text-anchor="middle" class="t-xs" style="fill:#fff;font-weight:700">RO</text>
  <text x="1069" y="869" class="t-xs muted">RUNTIME_ONLY only</text>

  <!-- Arrows -->
  <path d="M 149 184 L 149 272 L 360 272" class="line l-http" marker-end="url(#arr-green)"/>
  <path d="M 394 184 L 394 308 L 360 308" class="line l-http" marker-end="url(#arr-green)"/>
  <path d="M 664 184 L 664 668 L 498 668" class="line l-http" marker-end="url(#arr-green)"/>
  <path d="M 1025 184 L 1025 578" class="line l-plugin" marker-end="url(#arr-red)"/>

  <path d="M 304 292 L 340 292" class="line l-mode" marker-end="url(#arr-gray)"/>
  <path d="M 304 382 L 340 382" class="line l-mode" marker-end="url(#arr-gray)"/>

  <path d="M 460 428 L 460 578" class="line l-data" marker-end="url(#arr-blue)"/>
  <path d="M 888 428 L 888 652 L 764 652" class="line l-event" marker-end="url(#arr-purple)"/>
  <path d="M 638 652 L 1040 705" class="line l-plugin" marker-end="url(#arr-red)"/>
  <path d="M 154 652 L 154 780 L 370 780" class="line l-data" marker-end="url(#arr-blue)"/>
  <path d="M 388 742 L 388 780 L 526 780" class="line l-data" marker-end="url(#arr-blue)"/>
</svg>
