// jpackage requires a numeric x.y.z version; extract it from the git tag.
def appVersion = { ->
    def m = (resolvedVersionTag =~ /(\d+)\.(\d+)(?:\.(\d+))?/)
    if (m.find()) return "${m.group(1)}.${m.group(2)}.${m.group(3) ?: '0'}"
    return '1.0.0'
}()

