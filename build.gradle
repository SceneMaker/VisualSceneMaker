plugins {
    id 'java'
    id 'net.nemerosa.versioning' version '3.1.0'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}
javadoc { options.encoding = 'UTF-8' }

group 'de.dfki'
def resolvedVersionTag = versioning.info.lastTag
if (resolvedVersionTag == null
        || resolvedVersionTag.isBlank()
        || resolvedVersionTag == 'WebEditor_v0.1'
        || !resolvedVersionTag.toLowerCase().startsWith('web-')) {
    resolvedVersionTag = 'Web-v1.0'
}
allprojects {
    version = resolvedVersionTag
}


subprojects {
    plugins.withId('java') {
        def isJava17Module = project.path == ':core'
                || project.path == ':core-webserver'
                || project.path == ':core-http-jdk'
                || project.path == ':core-http-android'
                || project.path == ':core-logic-jpl'
                || project.path == ':runtime-server'
                || project.path.startsWith(':plugins:')
        if (!isJava17Module) {
            java {
                toolchain {
                    languageVersion = JavaLanguageVersion.of(21)
                }
            }
        }
        if (isJava17Module) {
            tasks.withType(JavaCompile).configureEach {
                options.release = 17
            }
        }
    }
}

repositories {
    mavenCentral()
    maven { url "https://repo.spring.io/libs-release" }
}

