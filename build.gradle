plugins {
    id 'java'
    id 'org.openjfx.javafxplugin' version '0.0.13'
    id 'net.nemerosa.versioning' version '3.0.0'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}
javadoc { options.encoding = 'UTF-8' }

group 'de.dfki'
allprojects {
    version = versioning.info.lastTag
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

subprojects {
    plugins.withId('java') {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }
    }
}

repositories {
    mavenCentral()
    maven { url "https://repo.spring.io/libs-release" }
}

javafx {
    version = '21'
    modules = [ 'javafx.controls', 'javafx.graphics', 'javafx.fxml', 'javafx.swing' ]
}

dependencies {
    testImplementation group: 'junit', name: 'junit', version: '4.0'
    // https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter-api
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '5.3.2'
    implementation project(":core", {p->p.ext.flavor = "pc"; p.version = versioning.info.lastTag})
    implementation fileTree(dir: 'lib', include: "*.jar")
    implementation project(":plugins:AndroidGui")
    implementation project(":plugins:studymaster-web")
    implementation project(":plugins:emma-user-model")
    implementation project(":plugins:decad")
    implementation project(":plugins:htmlgui-ws")
    implementation project(":plugins:odp")
    implementation project(":plugins:yallah")
    implementation project(":plugins:ssi")
    implementation project(":plugins:ssj")
    implementation project(":plugins:reeti")
    implementation project(":plugins:timer")
    implementation project(":plugins:tricatworld")
    implementation project(":plugins:charamel")
    implementation project(":plugins:charamel-ws")
    implementation project(":plugins:extensionAPI")
    implementation project(":plugins:sockets")
    implementation project(":plugins:DriveSimulator")
    implementation "io.javalin:javalin:3.8.0"
    implementation 'org.jetbrains:annotations:16.0.2'
    // https://mvnrepository.com/artifact/org.slick2d/slick2d-core
    implementation group: 'org.slick2d', name: 'slick2d-core', version: '1.0.2' // needed for documentation
    // https://mvnrepository.com/artifact/org.reflections/reflections
    implementation group: 'org.reflections', name: 'reflections', version: '0.9.12'
    // https://mvnrepository.com/artifact/jpl/jpl
    implementation group: 'jpl', name: 'jpl', version: '7.4.0'
    // https://mvnrepository.com/artifact/de.sciss/sphinx4
//    implementation group: 'de.dfki.mary', name: 'marytts-client', version: '5.1.2'
    // https://mvnrepository.com/artifact/net.java.dev.jna/jna
    implementation group: 'net.java.dev.jna', name: 'jna', version: '4.2.2'
    // https://mvnrepository.com/artifact/net.java.dev.jna/jna-platform
    implementation group: 'net.java.dev.jna', name: 'jna-platform', version: '4.2.2'
    // https://mvnrepository.com/artifact/com.1stleg/jnativehook
    implementation group: 'com.1stleg', name: 'jnativehook', version: '2.1.0'
    // https://mvnrepository.com/artifact/com.fifesoft/autocomplete
    implementation group: 'com.fifesoft', name: 'autocomplete', version: '2.0.5.1'
    // https://mvnrepository.com/artifact/math.geom2d/javaGeom
    implementation group: 'math.geom2d', name: 'javaGeom', version: '0.11.1'
    // https://mvnrepository.com/artifact/net.sourceforge.javaflacencoder/java-flac-encoder
    implementation group: 'net.sourceforge.javaflacencoder', name: 'java-flac-encoder', version: '0.3.7'
    // https://mvnrepository.com/artifact/org.json/json
    implementation group: 'org.json', name: 'json', version: '20171018'
    // https://mvnrepository.com/artifact/javax.xml.bind/jaxb-api
    implementation group: 'javax.xml.bind', name: 'jaxb-api', version: '2.4.0-b180830.0359'
    // https://mvnrepository.com/artifact/com.github.sarxos/webcam-capture
    implementation group: 'com.github.sarxos', name: 'webcam-capture', version: '0.3.12'
    // https://mvnrepository.com/artifact/com.google.zxing/core
    implementation group: 'com.google.zxing', name: 'core', version: '2.0'
    // https://mvnrepository.com/artifact/com.google.zxing/javase
    implementation group: 'com.google.zxing', name: 'javase', version: '2.0'
    // https://mvnrepository.com/artifact/org.slf4j/slf4j-api
    implementation group: 'org.slf4j', name: 'slf4j-api', version: '1.7.25'
    // https://mvnrepository.com/artifact/com.nativelibs4java/bridj
    implementation group: 'com.nativelibs4java', name: 'bridj', version: '0.7.0'
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withJavadocJar()
    withSourcesJar()
}
def includeJavaFxRuntime = project.hasProperty("includeJavaFx") &&
        !"false".equalsIgnoreCase(project.property("includeJavaFx").toString())
def runtimeClasspathForJar = {
    def files = configurations.runtimeClasspath
    if (includeJavaFxRuntime) {
        return files
    }
    return files.filter { file ->
        if (file.isDirectory()) {
            return true
        }
        def name = file.name
        def lower = name.toLowerCase()
        return !(lower.startsWith("javafx-") || lower.contains("javafx") || name.contains("JFX"))
    }
}
jar {
    duplicatesStrategy = 'exclude'
    from {
            runtimeClasspathForJar().collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    manifest {
        attributes(
                'Main-Class': 'de.dfki.vsm.SceneMaker3',
                'build' : versioning.info.build,
                'Build-Revision': versioning.info.commit,
                'Build-Date': new Date().format("yyyy-MM-dd HH:mm:ss"),
                'Full-Version': versioning.info.full,
                'Last-Tag': versioning.info.lastTag
        )
    }
}

import java.util.Locale

def webUiDir = file("web-ui")
def isWindows = System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows")
def defaultNpmCmd = isWindows ? "npm.cmd" : "npm"
def npmCommand = project.findProperty("npmCommand") ?: defaultNpmCmd
def skipWebUi = project.hasProperty("skipWebUi") && !"false".equalsIgnoreCase(project.property("skipWebUi").toString())
def webUiSkipLogged = false

def npmAvailable = {
    def cmd = npmCommand.toString()
    File cmdFile = new File(cmd)
    if (cmdFile.isAbsolute()) {
        return cmdFile.exists()
    }
    def pathEnv = System.getenv("PATH")
    if (pathEnv == null || pathEnv.isBlank()) {
        return false
    }
    def separator = java.util.regex.Pattern.quote(File.pathSeparator)
    return pathEnv.split(separator).any { new File(it, cmd).exists() }
}

def shouldRunWebUiTasks = {
    if (!webUiDir.exists() || !file("${webUiDir}/package.json").exists()) {
        if (!webUiSkipLogged) {
            logger.lifecycle("Skipping web UI build: web-ui package.json not found.")
            webUiSkipLogged = true
        }
        return false
    }
    if (skipWebUi) {
        if (!webUiSkipLogged) {
            logger.lifecycle("Skipping web UI build: skipWebUi=true.")
            webUiSkipLogged = true
        }
        return false
    }
    if (!npmAvailable()) {
        if (!webUiSkipLogged) {
            logger.warn("Skipping web UI build: npm not found. Install Node.js or set -PnpmCommand=/path/to/npm.")
            webUiSkipLogged = true
        }
        return false
    }
    return true
}

tasks.register("webUiInstall", Exec) {
    workingDir webUiDir
    commandLine npmCommand, "install"
    inputs.file(file("${webUiDir}/package.json"))
    outputs.dir(file("${webUiDir}/node_modules"))
    onlyIf { shouldRunWebUiTasks() }
}

tasks.register("webUiBuild", Exec) {
    workingDir webUiDir
    commandLine npmCommand, "run", "build"
    dependsOn tasks.named("webUiInstall")
    inputs.dir(file("${webUiDir}/src"))
    inputs.file(file("${webUiDir}/index.html"))
    inputs.file(file("${webUiDir}/vite.config.js"))
    inputs.file(file("${webUiDir}/svelte.config.js"))
    inputs.file(file("${webUiDir}/package.json"))
    outputs.dir(file("src/main/resources/web-ui"))
    onlyIf { shouldRunWebUiTasks() }
}

processResources.dependsOn tasks.named("webUiBuild")
tasks.named("sourcesJar") {
    dependsOn tasks.named("webUiBuild")
}
