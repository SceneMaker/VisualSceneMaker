tasks.register('generateCapabilitySnapshot') {
    group = 'verification'
    description = 'Generates a capability snapshot JSON from project.xml + sceneflow.xml.'

    doLast {
        def snapshotProjectDir = (findProperty('snapshotProjectDir')
                ?: "${projectDir}/doc/DesignPatterns").toString()
        def snapshotOutPath = (findProperty('snapshotOut')
                ?: "${layout.buildDirectory.get().asFile}/reports/capability-snapshot.json").toString()

        def sourceDir = file(snapshotProjectDir)
        def projectXmlFile = file("${sourceDir}/project.xml")
        def sceneFlowXmlFile = file("${sourceDir}/sceneflow.xml")

        if (!sourceDir.exists()) {
            throw new GradleException("Snapshot source directory not found: ${sourceDir}")
        }
        if (!sceneFlowXmlFile.exists()) {
            throw new GradleException("sceneflow.xml not found in: ${sourceDir}")
        }

        def slurper = new XmlSlurper(false, false)
        def sceneFlow = slurper.parse(sceneFlowXmlFile)
        def projectXml = projectXmlFile.exists() ? slurper.parse(projectXmlFile) : null

        def edgeTypeMap = [
                EEdge: 'EEDGE',
                CEdge: 'CEDGE',
                PEdge: 'PEDGE',
                TEdge: 'TEDGE',
                FEdge: 'FEDGE',
                IEdge: 'IEDGE'
        ]

        def allowedEdgeTypes = ['EEDGE', 'CEDGE', 'PEDGE', 'TEDGE', 'FEDGE', 'IEDGE']

        def parseBoolean = { String value ->
            value != null && value.trim().equalsIgnoreCase('true')
        }

        def parseIntSafe = { String value ->
            try {
                return Integer.parseInt(value?.trim())
            } catch (Exception ignored) {
                return null
            }
        }

        def literalValue = { node ->
            def tag = node.name().toString()
            if (tag == 'StringLiteral') {
                return "\"${node.text()}\""
            }
            if (tag == 'SimpleVariable') {
                return node.@name.text()
            }
            if (tag == 'IntLiteral' || tag == 'FloatLiteral' || tag == 'BoolLiteral') {
                def attr = node.@value.text()
                return attr ? attr : node.text()
            }
            return node.text()
        }

        def expressionToText
        expressionToText = { node ->
            def tag = node.name().toString()
            def children = node.children().findAll { it instanceof groovy.util.slurpersupport.NodeChild }

            if (children.isEmpty()) {
                return literalValue(node)?.toString()?.trim()
            }

            if (tag == 'Eq' && children.size() == 2) {
                return "${expressionToText(children[0])} == ${expressionToText(children[1])}"
            }
            if (tag == 'Ne' && children.size() == 2) {
                return "${expressionToText(children[0])} != ${expressionToText(children[1])}"
            }
            if (tag == 'Lt' && children.size() == 2) {
                return "${expressionToText(children[0])} < ${expressionToText(children[1])}"
            }
            if (tag == 'Le' && children.size() == 2) {
                return "${expressionToText(children[0])} <= ${expressionToText(children[1])}"
            }
            if (tag == 'Gt' && children.size() == 2) {
                return "${expressionToText(children[0])} > ${expressionToText(children[1])}"
            }
            if (tag == 'Ge' && children.size() == 2) {
                return "${expressionToText(children[0])} >= ${expressionToText(children[1])}"
            }
            if (tag == 'Neg' && children.size() == 1) {
                return "-${expressionToText(children[0])}"
            }
            if (tag == 'And' && children.size() == 2) {
                return "${expressionToText(children[0])} && ${expressionToText(children[1])}"
            }
            if (tag == 'Or' && children.size() == 2) {
                return "${expressionToText(children[0])} || ${expressionToText(children[1])}"
            }

            def renderedChildren = children.collect { expressionToText(it) }.findAll { it != null && !it.isBlank() }
            if (renderedChildren.isEmpty()) {
                return tag
            }
            return "${tag}(${renderedChildren.join(', ')})"
        }

        def plugins = []
        if (projectXml != null) {
            projectXml.Plugins.Plugin.each { p ->
                plugins << [
                        name     : p.@name.text(),
                        className: p.@class.text(),
                        type     : p.@type.text(),
                        load     : parseBoolean(p.@load.text())
                ]
            }
        }

        def agents = []
        if (projectXml != null) {
            projectXml.Agents.Agent.each { a ->
                def features = []
                a.Feature.each { f ->
                    features << [
                            key  : f.@key.text(),
                            value: f.@val.text()
                    ]
                }
                agents << [
                        name    : a.@name.text(),
                        device  : a.@device.text(),
                        features: features
                ]
            }
        }

        def variables = []
        sceneFlow.Declare.VariableDefinition.each { v ->
            variables << [
                    name       : v.@name.text(),
                    type       : v.@type.text(),
                    scope      : 'global',
                    ownerNodeId: 'SceneFlow'
            ]
        }

        def nodes = []
        def edges = []

        def extractEdgeCondition = { edgeNode ->
            def exprNode = edgeNode.children().find {
                if (!(it instanceof groovy.util.slurpersupport.NodeChild)) {
                    return false
                }
                def n = it.name().toString()
                return n != 'Graphics' && n != 'Commands'
            }
            if (exprNode == null) {
                return null
            }
            return expressionToText(exprNode)
        }

        def collectEdgesForOwner = { ownerId, ownerNode ->
            edgeTypeMap.each { xmlTag, canonicalType ->
                ownerNode."${xmlTag}".each { e ->
                    def edgeEntry = [
                            type       : canonicalType,
                            sourceNodeId: ownerId,
                            targetNodeId: e.@target.text()
                    ]
                    if (canonicalType == 'TEDGE') {
                        def timeout = parseIntSafe(e.@timeout.text())
                        if (timeout != null) {
                            edgeEntry.timeoutMs = timeout
                        }
                    }
                    if (canonicalType == 'PEDGE') {
                        def probability = parseIntSafe(e.@probability.text())
                        if (probability != null) {
                            edgeEntry.probability = probability
                        }
                    }
                    if (canonicalType == 'CEDGE' || canonicalType == 'IEDGE') {
                        def conditionText = extractEdgeCondition(e)
                        if (conditionText) {
                            edgeEntry.conditionText = conditionText
                        }
                    }
                    edges << edgeEntry
                }
            }
        }

        def collectNodeTree
        collectNodeTree = { container, parentSuperNodeId ->
            container.Node.each { n ->
                def nodeId = n.@id.text()
                nodes << [
                        id               : nodeId,
                        name             : n.@name.text(),
                        parentSuperNodeId: parentSuperNodeId,
                        isSuperNode      : false,
                        isHistoryNode    : parseBoolean(n.@history.text()),
                        commandCount     : n.Commands.Command.size()
                ]
                collectEdgesForOwner(nodeId, n)
            }

            container.SuperNode.each { s ->
                def superNodeId = s.@id.text()
                def startNodeIds = s.@start.text().split(';').findAll { it != null && !it.trim().isEmpty() }
                nodes << [
                        id               : superNodeId,
                        name             : s.@name.text(),
                        parentSuperNodeId: parentSuperNodeId,
                        isSuperNode      : true,
                        isHistoryNode    : false,
                        startNodeIds     : startNodeIds,
                        commandCount     : s.Commands.Command.size()
                ]
                collectEdgesForOwner(superNodeId, s)
                collectNodeTree(s, superNodeId)
            }
        }

        collectNodeTree(sceneFlow, 'SceneFlow')

        def startNodeIds = sceneFlow.@start.text().split(';').findAll { it != null && !it.trim().isEmpty() }
        def rootId = sceneFlow.@id.text()?.trim()
        if (!rootId) {
            rootId = 'SceneFlow'
        }

        def snapshot = [
                snapshotVersion: '1.0',
                generatedAt    : new Date().format("yyyy-MM-dd'T'HH:mm:ssXXX"),
                source         : sourceDir.absolutePath,
                project        : [
                        name          : projectXml?.@name?.text() ?: sourceDir.name,
                        androidProject: parseBoolean(projectXml?.@androidProject?.text()),
                        plugins       : plugins,
                        agents        : agents
                ],
                flow           : [
                        rootId          : rootId,
                        startNodeIds    : startNodeIds,
                        variables       : variables,
                        allowedEdgeTypes: allowedEdgeTypes,
                        nodes           : nodes,
                        edges           : edges
                ]
        ]

        def outFile = file(snapshotOutPath)
        outFile.parentFile.mkdirs()
        outFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(snapshot)) + System.lineSeparator()

        logger.lifecycle("Capability snapshot written to: ${outFile}")
        logger.lifecycle("Source project directory: ${sourceDir}")
    }
}

tasks.register('validateSceneFlowIr', JavaExec) {
    group = 'verification'
    description = 'Validates SceneFlow IR semantics against a capability snapshot.'
    dependsOn tasks.named('classes')

    def irPath = (findProperty('ir') ?: "${projectDir}/doc/sceneflow-ir.wait-for-ok-button.example.json").toString()
    def snapshotPath = (findProperty('snapshot')
            ?: "${projectDir}/doc/capability-snapshot.designpatterns.json").toString()

    mainClass = 'de.dfki.vsm.sceneflow.ir.SceneFlowIrSemanticValidatorCli'
    classpath = sourceSets.main.runtimeClasspath
    args irPath, snapshotPath
}

tasks.register('compileSceneFlowIr', JavaExec) {
    group = 'verification'
    description = 'Compiles SceneFlow IR patch operations into canonical sceneflow.xml output.'
    dependsOn tasks.named('classes')

    def irPath = (findProperty('ir') ?: "${projectDir}/doc/sceneflow-ir.wait-for-ok-button.example.json").toString()
    def sceneFlowPath = (findProperty('sceneflow')
            ?: "${projectDir}/doc/DesignPatterns/sceneflow.xml").toString()
    def outputPath = (findProperty('out')
            ?: "${layout.buildDirectory.get().asFile}/reports/sceneflow-ir-compiled.xml").toString()

    mainClass = 'de.dfki.vsm.sceneflow.ir.SceneFlowIrCompilerCli'
    classpath = sourceSets.main.runtimeClasspath
    args irPath, sceneFlowPath, outputPath
}

tasks.register('generateFlowFromSituation', JavaExec) {
    group = 'verification'
    description = 'Runs validate->compile orchestration with bounded IR retries.'
    dependsOn tasks.named('classes')

    def snapshotPath = (findProperty('snapshot')
            ?: "${projectDir}/doc/capability-snapshot.designpatterns.json").toString()
    def sceneFlowPath = (findProperty('sceneflow')
            ?: "${projectDir}/doc/DesignPatterns/sceneflow.xml").toString()
    def outputPath = (findProperty('out')
            ?: "${layout.buildDirectory.get().asFile}/reports/sceneflow-orchestrated.xml").toString()
    def irs = (findProperty('irs')
            ?: "${projectDir}/doc/sceneflow-ir.wait-for-ok-button.example.json").toString()
    def irArgs = irs.split(',').collect { it.trim() }.findAll { !it.isEmpty() }

    mainClass = 'de.dfki.vsm.sceneflow.ir.SceneFlowIrOrchestratorCli'
    classpath = sourceSets.main.runtimeClasspath
    args([snapshotPath, sceneFlowPath, outputPath] + irArgs)
}

tasks.register('generateSceneFlowIrTemplates', JavaExec) {
    group = 'verification'
    description = 'Generates template-based IR candidates from a natural-language situation.'
    dependsOn tasks.named('classes')

    def snapshotPath = (findProperty('snapshot')
            ?: "${projectDir}/doc/capability-snapshot.designpatterns.json").toString()
    def outDir = (findProperty('outDir')
            ?: "${layout.buildDirectory.get().asFile}/reports/sceneflow-ir-templates").toString()
    def situation = (findProperty('situation')
            ?: "Wait until the user pressed the Okay button").toString()

    mainClass = 'de.dfki.vsm.sceneflow.ir.SceneFlowIrTemplateGeneratorCli'
    classpath = sourceSets.main.runtimeClasspath
    args snapshotPath, outDir, situation
}

tasks.register('generateSceneFlowFromSituation', JavaExec) {
    group = 'verification'
    description = 'End-to-end pipeline: template candidates -> semantic validation -> compile -> report.'
    dependsOn tasks.named('classes')

    def snapshotPath = (findProperty('snapshot')
            ?: "${projectDir}/doc/capability-snapshot.designpatterns.json").toString()
    def sceneFlowPath = (findProperty('sceneflow')
            ?: "${projectDir}/doc/DesignPatterns/sceneflow.xml").toString()
    def outputPath = (findProperty('out')
            ?: "${layout.buildDirectory.get().asFile}/reports/sceneflow-generated.xml").toString()
    def reportPath = (findProperty('report')
            ?: "${layout.buildDirectory.get().asFile}/reports/sceneflow-generation-report.json").toString()
    def projectOutDir = (findProperty('outProjectDir')
            ?: "${layout.buildDirectory.get().asFile}/reports/sceneflow-generated-project").toString()
    def situation = (findProperty('situation')
            ?: "Wait until the user pressed the Okay button").toString()
    def mode = (findProperty('mode') ?: "template").toString()
    def outputMode = (findProperty('outputMode') ?: "standalone").toString()
    def constraintResolutionMode = (findProperty('constraintResolutionMode') ?: "permissive").toString()
    def llmBaseUrl = (findProperty('llmBaseUrl') ?: "").toString()
    def llmApiKey = (findProperty('llmApiKey') ?: "").toString()
    def llmModel = (findProperty('llmModel') ?: "").toString()
    def llmTimeoutSec = (findProperty('llmTimeoutSec') ?: "30").toString()
    def llmMaxCandidates = (findProperty('llmMaxCandidates') ?: "3").toString()

    mainClass = 'de.dfki.vsm.sceneflow.ir.SceneFlowSituationPipelineCli'
    classpath = sourceSets.main.runtimeClasspath
    systemProperty 'sceneflow.pipeline.mode', mode
    systemProperty 'sceneflow.pipeline.outputMode', outputMode
    systemProperty 'sceneflow.pipeline.constraintResolutionMode', constraintResolutionMode
    systemProperty 'sceneflow.pipeline.projectOutDir', projectOutDir
    systemProperty 'sceneflow.llm.baseUrl', llmBaseUrl
    systemProperty 'sceneflow.llm.apiKey', llmApiKey
    systemProperty 'sceneflow.llm.model', llmModel
    systemProperty 'sceneflow.llm.timeoutSec', llmTimeoutSec
    systemProperty 'sceneflow.llm.maxCandidates', llmMaxCandidates
    args snapshotPath, sceneFlowPath, outputPath, reportPath, situation
}

tasks.register('explainSceneFlow', JavaExec) {
    group = 'verification'
    description = 'Generates a deterministic natural-language explanation report from sceneflow.xml.'
    dependsOn tasks.named('classes')

    def sceneFlowPath = (findProperty('sceneflow')
            ?: "${projectDir}/doc/DesignPatterns/sceneflow.xml").toString()
    def outputPath = (findProperty('out')
            ?: "${layout.buildDirectory.get().asFile}/reports/sceneflow-explanation.json").toString()
    def explainIncludeIds = (findProperty('explainIncludeIds') ?: "false").toString()
    def explainAudience = (findProperty('explainAudience') ?: "reader-friendly").toString()

    mainClass = 'de.dfki.vsm.sceneflow.ir.SceneFlowNarrativeExplainerCli'
    classpath = sourceSets.main.runtimeClasspath
    systemProperty 'sceneflow.explain.includeIds', explainIncludeIds
    systemProperty 'sceneflow.explain.audience', explainAudience
    args sceneFlowPath, outputPath
}

def androidThinBaseProjects = [
        project(':core'),
        project(':core-http-android')
]
def androidThinPluginProjects = subprojects.findAll { candidate ->
    if (!candidate.path.startsWith(':plugins:')) {
        return false
    }
    def descriptorFile = candidate.file('src/main/resources/plugin-properties.json')
    if (!descriptorFile.exists()) {
        return false
    }
    try {
        def descriptor = new groovy.json.JsonSlurper().parse(descriptorFile)
        return descriptor?.plugin?.androidCompatible == true
    } catch (Exception ignored) {
        return false
    }
}
def androidThinJarProjects = (androidThinBaseProjects + androidThinPluginProjects).unique()
def androidThinJarOutputDir = layout.projectDirectory.dir('android-thin-jars')

configure(androidThinJarProjects) {
    plugins.withId('java') {
        tasks.register('androidThinJar', Jar) {
            group = 'build'
            description = "Builds a thin Android jar for ${project.path} (without bundled dependencies)."
            archiveClassifier.set('android-thin')
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
            from sourceSets.main.output
        }
    }
}

tasks.register('assembleAndroidThinJars', Sync) {
    group = 'build'
    description = 'Builds and collects Android thin jars into /android-thin-jars (core + androidCompatible plugins).'
    dependsOn(androidThinJarProjects.collect { it.tasks.named('androidThinJar') })
    from(androidThinJarProjects.collect { it.tasks.named('androidThinJar').flatMap { jarTask -> jarTask.archiveFile } })
    into(androidThinJarOutputDir)
}

tasks.register('cleanAndroidThinJars', Delete) {
    group = 'build'
    description = 'Deletes the collected Android thin jars directory.'
    delete(androidThinJarOutputDir)
}

tasks.named('clean') {
    dependsOn(tasks.named('cleanAndroidThinJars'))
}

def includeJavaFxRuntime = project.hasProperty("includeJavaFx") &&
        !"false".equalsIgnoreCase(project.property("includeJavaFx").toString())
def runtimeClasspathForJar = {
    def files = configurations.runtimeClasspath
    if (includeJavaFxRuntime) {
        return files
    }
    return files.filter { file ->
        if (file.isDirectory()) {
            return true
        }
        def name = file.name
        def lower = name.toLowerCase()
        return !(lower.startsWith("javafx-") || lower.contains("javafx") || name.contains("JFX"))
    }
}
jar {
    duplicatesStrategy = 'exclude'
    from {
            runtimeClasspathForJar().collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    archiveClassifier.set('plain')
    manifest {
        attributes(
                // Phase 8: Updated to SceneMaker4 (web-only, Swing removed)
                'Main-Class': 'de.dfki.vsm.SceneMaker4',
                'build' : versioning.info.build,
                'Build-Revision': versioning.info.commit,
                'Build-Date': new Date().format("yyyy-MM-dd HH:mm:ss"),
                'Full-Version': versioning.info.full,
                'Last-Tag': resolvedVersionTag
        )
    }
}

shadowJar {
    duplicatesStrategy = 'exclude'
    archiveClassifier.set('shadow')
    manifest {
        attributes(
                // Phase 8: Updated to SceneMaker4 (web-only, Swing removed)
                'Main-Class': 'de.dfki.vsm.SceneMaker4',
                'build' : versioning.info.build,
                'Build-Revision': versioning.info.commit,
                'Build-Date': new Date().format("yyyy-MM-dd HH:mm:ss"),
                'Full-Version': versioning.info.full,
                'Last-Tag': resolvedVersionTag
        )
    }
}

// Run task to start the editor (SceneMaker4 - web-only)
task run(type: JavaExec) {
    group = 'application'
    description = 'Runs the VisualSceneMaker web editor'
    mainClass = 'de.dfki.vsm.SceneMaker4'
    systemProperty 'vsm.buildDate', new Date().format("yyyy-MM-dd HH:mm:ss")
    systemProperty 'vsm.buildRevision', versioning.info.commit
    systemProperty 'vsm.version', resolvedVersionTag
    systemProperty 'vsm.build', versioning.info.build
    classpath = sourceSets.main.runtimeClasspath
    if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        jvmArgs(
                '-Xdock:name=VSM Web',
                "-Xdock:icon=${projectDir}/src/main/resources/app-icons/vsm-docicon.png",
                '-Dapple.awt.application.name=VSM Web',
                '-Dcom.apple.mrj.application.apple.menu.about.name=VSM Web'
        )
    }
}
