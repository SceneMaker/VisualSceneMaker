tasks.register('generateCapabilitySnapshot', JavaExec) {
    group = 'verification'
    description = 'Generates a capability snapshot JSON from a project directory.'
    dependsOn tasks.named('classes')

    def snapshotProjectDir = (findProperty('snapshotProjectDir')
            ?: "${projectDir}/doc/DesignPatterns").toString()
    def snapshotOutPath = (findProperty('snapshotOut')
            ?: "${layout.buildDirectory.get().asFile}/reports/capability-snapshot.json").toString()
    // Passing the schema makes the run fail rather than write a snapshot the schema would reject.
    def schemaPath = "${projectDir}/doc/capability-snapshot.schema.json"

    mainClass = 'de.dfki.vsm.sceneflow.ir.CapabilitySnapshotCli'
    classpath = sourceSets.main.runtimeClasspath
    args snapshotProjectDir, snapshotOutPath, schemaPath
}

