tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('editor/src/main/resources/images/vsm_logo.png') {
        into('app-icons')
        rename('vsm_logo.png', 'vsm-docicon.png')
    }
}

tasks.named('build') {
    dependsOn ':core:syncWebUi'
}

tasks.register('generateIcns') {
    dependsOn tasks.jar
    outputs.file(appIconIcns)
    doLast {
        def iconsetDir = file("$buildDir/jpackage/VSM.iconset")
        iconsetDir.mkdirs()
        exec { commandLine 'sips', '-z', '16', '16', appIconPng, '--out', "${iconsetDir}/icon_16x16.png" }
        exec { commandLine 'sips', '-z', '32', '32', appIconPng, '--out', "${iconsetDir}/icon_16x16@2x.png" }
        exec { commandLine 'sips', '-z', '32', '32', appIconPng, '--out', "${iconsetDir}/icon_32x32.png" }
        exec { commandLine 'sips', '-z', '64', '64', appIconPng, '--out', "${iconsetDir}/icon_32x32@2x.png" }
        exec { commandLine 'sips', '-z', '128', '128', appIconPng, '--out', "${iconsetDir}/icon_128x128.png" }
        exec { commandLine 'sips', '-z', '256', '256', appIconPng, '--out', "${iconsetDir}/icon_128x128@2x.png" }
        exec { commandLine 'sips', '-z', '256', '256', appIconPng, '--out', "${iconsetDir}/icon_256x256.png" }
        exec { commandLine 'sips', '-z', '512', '512', appIconPng, '--out', "${iconsetDir}/icon_256x256@2x.png" }
        exec { commandLine 'sips', '-z', '512', '512', appIconPng, '--out', "${iconsetDir}/icon_512x512.png" }
        exec { commandLine 'sips', '-z', '1024', '1024', appIconPng, '--out', "${iconsetDir}/icon_512x512@2x.png" }
        exec { commandLine 'iconutil', '-c', 'icns', iconsetDir, '-o', appIconIcns.get().asFile }
    }
}

tasks.register('jpackageApp', Exec) {
    dependsOn tasks.jar
    dependsOn tasks.named('generateIcns')
    def jarFile = tasks.jar.archiveFile.get().asFile
    commandLine 'jpackage',
            '--type', 'app-image',
            '--name', appName,
            '--input', layout.buildDirectory.dir('libs').get().asFile.absolutePath,
            '--main-jar', jarFile.name,
            '--main-class', 'de.dfki.vsm.SceneMaker4',
            '--icon', appIconIcns.get().asFile.absolutePath,
            '--dest', layout.buildDirectory.dir('jpackage').get().asFile.absolutePath
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.register('compileServices') {
    group = 'build'
    description = 'Compile all services subprojects.'
    dependsOn(subprojects.findAll { it.path.startsWith(':services:') }.collect { it.path + ':compileJava' })
}

tasks.register('generatePluginDescriptors') {
    group = 'documentation'
    description = 'Generate draft sceneflow-interface.json files for plugins.'
    doLast {
        def pluginsDir = file('plugins')
        if (!pluginsDir.exists()) {
            throw new GradleException("plugins directory not found at ${pluginsDir}")
        }
        def force = project.hasProperty('forceDescriptors') &&
                project.property('forceDescriptors').toString().equalsIgnoreCase('true')
        def updateSections = []
        if (project.hasProperty('updateDescriptorSections')) {
            updateSections = project.property('updateDescriptorSections')
                    .toString()
                    .split(',')
                    .collect { it.trim() }
                    .findAll { !it.isEmpty() }
        }
        def commandVars = ['name', 'activity_name', 'action_name', 'cmd']
        def cmdVarPattern = commandVars.collect { "\\b${it}\\b" }.join('|')
        def equalsIgnoreCasePattern = ~/(?:${cmdVarPattern})\.equalsIgnoreCase\("([^"]+)"\)/
        def reverseEqualsIgnoreCasePattern = ~/"([^"]+)"\.equalsIgnoreCase\((?:${cmdVarPattern})\)/
        def switchCasePattern = ~/case\s+"([^"]+)"\s*:/
        def activityGetPattern = ~/activity\.get\("([^"]+)"\)/
        def featureValuePattern = ~/getActionFeatureValue\("([^"]+)"(?:\s*,|\s*\))/
        def configPattern = ~/mConfig\.getProperty\("([^"]+)"/
        def setVariableLiteralPattern = ~/setVariable\(\s*"([^"]+)"\s*,/
        def setVariableDynamicPattern = ~/setVariable\(\s*([^,]+)\s*,/
        def valueTypePattern = ~/new\s+(StringValue|IntValue|FloatValue|BooleanValue|ListValue|StructValue)\b/
        def booleanLiteralPattern = ~/setVariable\([^,]+,\s*(true|false)\s*\)/
        def outputSignalPattern = ~/(\.send\s*\(|\.broadcast\s*\(|\.clientSend\s*\(|\.post\s*\(|\bTransport\.send\s*\()/
        def networkTokenPattern = ~/\b(Socket|WebSocket|Javalin|Datagram|Http|Transport)\b/

        pluginsDir.listFiles()
                .findAll { it.isDirectory() }
                .each { pluginDir ->
                    def javaFiles = fileTree(dir: pluginDir, include: '**/*.java').files
                    if (javaFiles.isEmpty()) {
                        return
                    }

                    def commands = new LinkedHashSet<String>()
                    def commandParams = new LinkedHashMap<String, LinkedHashSet<String>>()
                    def configKeys = new LinkedHashSet<String>()
                    def writes = new LinkedHashMap<String, Map>()
                    def executors = new LinkedHashSet<String>()
                    int inputScore = 0
                    int outputScore = 0
                    int processingScore = 0
                    def categoryReasons = new LinkedHashSet<String>()

                    javaFiles.each { f ->
                        def text = f.getText('UTF-8')
                        if (f.name.endsWith('Executor.java')) {
                            def className = text.find(/class\s+([A-Za-z0-9_]+)\s+/) { all, name -> name }
                            if (className) {
                                executors.add(className)
                            }
                        }

                        text.eachMatch(equalsIgnoreCasePattern) { m ->
                            commands.add(m[1])
                        }
                        text.eachMatch(reverseEqualsIgnoreCasePattern) { m ->
                            commands.add(m[1])
                        }
                        text.eachMatch(switchCasePattern) { m ->
                            commands.add(m[1])
                        }

                        def lines = text.readLines()
                        def lineCount = lines.size()

                        def extractParamsFromBlock = { String blockText ->
                            def blockParams = new LinkedHashSet<String>()
                            blockText.eachMatch(activityGetPattern) { mm ->
                                blockParams.add(mm[1])
                            }
                            blockText.eachMatch(featureValuePattern) { mm ->
                                blockParams.add(mm[1])
                            }
                            return blockParams
                        }

                        def getBlockTextFrom = { int startLine ->
                            int openIdx = -1
                            int depth = 0
                            StringBuilder sb = new StringBuilder()
                            for (int i = startLine; i < lineCount; i++) {
                                def line = lines[i]
                                sb.append(line).append('\n')
                                for (int c = 0; c < line.length(); c++) {
                                    char ch = line.charAt(c)
                                    if (ch == '{') {
                                        if (openIdx == -1) {
                                            openIdx = i
                                        }
                                        depth++
                                    } else if (ch == '}') {
                                        if (depth > 0) {
                                            depth--
                                            if (depth == 0 && openIdx != -1) {
                                                return sb.toString()
                                            }
                                        }
                                    }
                                }
                            }
                            return sb.toString()
                        }

                        def executeBlocks = new ArrayList<String>()
                        def executeSignaturePattern = ~/\bvoid\s+execute\s*\(/
                        for (int i = 0; i < lineCount; i++) {
                            def line = lines[i]
                            if ((line =~ executeSignaturePattern).find()) {
                                executeBlocks.add(getBlockTextFrom(i))
                            }
                        }

                        boolean executeHasOutbound = false
                        boolean executeHasNetwork = false
                        executeBlocks.each { block ->
                            def filtered = block.readLines()
                                    .findAll { ln -> !ln.contains("mLogger") && !ln.contains("logger") && !ln.contains("LOG") }
                                    .join("\n")
                            if ((filtered =~ outputSignalPattern).find()) {
                                executeHasOutbound = true
                            }
                            if ((filtered =~ networkTokenPattern).find()) {
                                executeHasNetwork = true
                            }
                        }

                        def setVarCount = 0
                        text.eachMatch(setVariableLiteralPattern) { m ->
                            setVarCount++
                        }
                        text.eachMatch(setVariableDynamicPattern) { m ->
                            setVarCount++
                        }

                        if (executeHasOutbound || executeHasNetwork) {
                            outputScore += 1
                            categoryReasons.add("io:outbound")
                        }

                        def nameLower = f.name.toLowerCase()
                        def isListenerFile = nameLower.contains("receiver") ||
                                nameLower.contains("listener") ||
                                nameLower.contains("handler") ||
                                nameLower.contains("server") ||
                                nameLower.contains("thread")
                        if (isListenerFile && setVarCount > 0) {
                            inputScore += setVarCount
                            categoryReasons.add("io:inbound")
                        } else if (setVarCount > 0 && !(executeHasOutbound || executeHasNetwork)) {
                            processingScore += setVarCount
                            categoryReasons.add("logic:state")
                        }

                        def blockText
                        for (int i = 0; i < lineCount; i++) {
                            def line = lines[i]
                            def m1 = (line =~ equalsIgnoreCasePattern)
                            def m2 = (line =~ reverseEqualsIgnoreCasePattern)
                            if (m1.find()) {
                                def cmd = m1.group(1)
                                blockText = getBlockTextFrom(i)
                                def blockParams = extractParamsFromBlock(blockText)
                                if (!commandParams.containsKey(cmd)) {
                                    commandParams[cmd] = new LinkedHashSet<String>()
                                }
                                commandParams[cmd].addAll(blockParams)
                            } else if (m2.find()) {
                                def cmd = m2.group(1)
                                blockText = getBlockTextFrom(i)
                                def blockParams = extractParamsFromBlock(blockText)
                                if (!commandParams.containsKey(cmd)) {
                                    commandParams[cmd] = new LinkedHashSet<String>()
                                }
                                commandParams[cmd].addAll(blockParams)
                            }
                        }

                        // Switch-case extraction for params per command
                        int braceDepth = 0
                        int switchDepth = -1
                        boolean pendingSwitch = false
                        String currentCase = null
                        StringBuilder caseBuffer = new StringBuilder()
                        def switchCommandVarPattern = ~/(?:^|[^A-Za-z0-9_])switch\s*\(\s*(?:${cmdVarPattern})\s*\)/
                        def flushCase = {
                            if (currentCase != null) {
                                def caseParams = extractParamsFromBlock(caseBuffer.toString())
                                if (!commandParams.containsKey(currentCase)) {
                                    commandParams[currentCase] = new LinkedHashSet<String>()
                                }
                                commandParams[currentCase].addAll(caseParams)
                            }
                            caseBuffer.setLength(0)
                        }
                        for (int i = 0; i < lineCount; i++) {
                            def line = lines[i]
                            if ((line =~ switchCommandVarPattern).find()) {
                                pendingSwitch = true
                            }
                            for (int c = 0; c < line.length(); c++) {
                                char ch = line.charAt(c)
                                if (ch == '{') {
                                    braceDepth++
                                    if (switchDepth == -1 && pendingSwitch) {
                                        switchDepth = braceDepth
                                        pendingSwitch = false
                                    }
                                } else if (ch == '}') {
                                    if (braceDepth == switchDepth) {
                                        flushCase()
                                        currentCase = null
                                        switchDepth = -1
                                    }
                                    braceDepth = Math.max(0, braceDepth - 1)
                                }
                            }
                            if (switchDepth != -1) {
                                def cm = (line =~ switchCasePattern)
                                if (cm.find()) {
                                    flushCase()
                                    currentCase = cm.group(1)
                                    caseBuffer.append(line).append('\n')
                                    continue
                                }
                                if (currentCase != null) {
                                    caseBuffer.append(line).append('\n')
                                }
                            }
                        }
                        text.eachMatch(configPattern) { m ->
                            configKeys.add(m[1])
                        }

                        text.readLines().each { line ->
                            def literalMatch = (line =~ setVariableLiteralPattern)
                            if (literalMatch.find()) {
                                def varName = literalMatch.group(1)
                                def type = 'string'
                                def typeMatch = (line =~ valueTypePattern)
                                if (typeMatch.find()) {
                                    switch (typeMatch.group(1)) {
                                        case 'IntValue':
                                            type = 'int'
                                            break
                                        case 'FloatValue':
                                            type = 'float'
                                            break
                                        case 'BooleanValue':
                                            type = 'bool'
                                            break
                                        case 'ListValue':
                                            type = 'list'
                                            break
                                        case 'StructValue':
                                            type = 'struct'
                                            break
                                        default:
                                            type = 'string'
                                    }
                                } else {
                                    def boolMatch = (line =~ booleanLiteralPattern)
                                    if (boolMatch.find()) {
                                        type = 'bool'
                                    }
                                }
                                if (!writes.containsKey(varName)) {
                                    writes[varName] = [var: varName, type: type, scope: 'global', inferred: true]
                                }
                            } else {
                                def dynMatch = (line =~ setVariableDynamicPattern)
                                if (dynMatch.find()) {
                                    def expr = dynMatch.group(1).trim()
                                    if (!expr.startsWith("\"")) {
                                        def key = "<dynamic:${expr}>"
                                        if (!writes.containsKey(key)) {
                                            writes[key] = [
                                                    var: "<dynamic>",
                                                    expression: expr,
                                                    type: "unknown",
                                                    scope: "global",
                                                    inferred: true
                                            ]
                                        }
                                    }
                                }
                            }
                        }
                    }

                    def descriptorFile = new File(pluginDir, 'sceneflow-interface.json')
                    def existingDescriptor = null
                    if (descriptorFile.exists()) {
                        def existingText = descriptorFile.getText('UTF-8')
                        if (!updateSections.isEmpty()) {
                            try {
                                existingDescriptor = new groovy.json.JsonSlurper().parseText(existingText)
                            } catch (Exception ex) {
                                logger.lifecycle("Failed to parse ${descriptorFile} for partial update: ${ex.message}")
                            }
                        }
                        if (!force && updateSections.isEmpty() && existingText.contains('"generated": false')) {
                            logger.lifecycle("Skipping ${descriptorFile} (generated=false). Use -PforceDescriptors=true to override.")
                            return
                        }
                    }

                    def cmdList = commands.collect { c ->
                        def paramSet = commandParams.containsKey(c) ? commandParams[c] : new LinkedHashSet<String>()
                        def paramList = paramSet.collect { p ->
                            [
                                    name       : p,
                                    type       : "string",
                                    required   : false,
                                    description: "",
                                    inferred   : true
                            ]
                        }
                        [
                                name   : c,
                                summary: "",
                                type   : "action",
                                params : paramList
                        ]
                    }

                    def categoryPrimary = "unknown"
                    def categorySecondary = []
                    def confidence = 0.5
                    def totalScore = inputScore + outputScore + processingScore
                    if (inputScore > 0 && outputScore > 0) {
                        categoryPrimary = "mixed"
                        categorySecondary = ["input", "output"]
                        confidence = totalScore > 0 ? Math.max(inputScore, outputScore) / totalScore : 0.6
                    } else if (inputScore > 0) {
                        categoryPrimary = "input"
                        confidence = totalScore > 0 ? inputScore / totalScore : 0.6
                    } else if (outputScore > 0) {
                        categoryPrimary = "output"
                        confidence = totalScore > 0 ? outputScore / totalScore : 0.6
                    } else if (processingScore > 0) {
                        categoryPrimary = "processing"
                        confidence = totalScore > 0 ? processingScore / totalScore : 0.6
                    }

                    def descriptor = [
                            schemaVersion: "1.0",
                            generated    : true,
                            plugin       : [
                                    id       : pluginDir.name,
                                    name     : pluginDir.name,
                                    className: executors ? executors.first() : "",
                                    executors: executors as List,
                                    description: "",
                                    tags     : []
                            ],
                            categories: [
                                    primary   : categoryPrimary,
                                    secondary : categorySecondary,
                                    confidence: Math.round(confidence * 1000d) / 1000d,
                                    inferred  : true,
                                    reason    : categoryReasons as List
                            ],
                            commands: cmdList,
                            writes  : writes.values() as List,
                            reads   : [],
                            config  : configKeys.collect { k ->
                                [
                                        key        : k,
                                        type       : "string",
                                        required   : false,
                                        default    : "",
                                        description: "",
                                        inferred   : true
                                ]
                            }
                    ]

                    if (existingDescriptor != null && !updateSections.isEmpty()) {
                        updateSections.each { section ->
                            if (descriptor.containsKey(section)) {
                                existingDescriptor[section] = descriptor[section]
                            }
                        }
                        descriptor = existingDescriptor
                    }

                    def json = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(descriptor))
                    descriptorFile.write(json + "\n", 'UTF-8')
                    logger.lifecycle("Wrote ${descriptorFile}")
                }
    }
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    filter {
        setFailOnNoMatchingTests(false)
    }
}
def includeJavaFxRuntime = project.hasProperty("includeJavaFx") &&
        !"false".equalsIgnoreCase(project.property("includeJavaFx").toString())
def runtimeClasspathForJar = {
    def files = configurations.runtimeClasspath
    if (includeJavaFxRuntime) {
        return files
    }
    return files.filter { file ->
        if (file.isDirectory()) {
            return true
        }
        def name = file.name
        def lower = name.toLowerCase()
        return !(lower.startsWith("javafx-") || lower.contains("javafx") || name.contains("JFX"))
    }
}
jar {
    duplicatesStrategy = 'exclude'
    from {
            runtimeClasspathForJar().collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    archiveClassifier.set('plain')
    manifest {
        attributes(
                // Phase 8: Updated to SceneMaker4 (web-only, Swing removed)
                'Main-Class': 'de.dfki.vsm.SceneMaker4',
                'build' : versioning.info.build,
                'Build-Revision': versioning.info.commit,
                'Build-Date': new Date().format("yyyy-MM-dd HH:mm:ss"),
                'Full-Version': versioning.info.full,
                'Last-Tag': versioning.info.lastTag
        )
    }
}

shadowJar {
    duplicatesStrategy = 'exclude'
    archiveClassifier.set('shadow')
    manifest {
        attributes(
                // Phase 8: Updated to SceneMaker4 (web-only, Swing removed)
                'Main-Class': 'de.dfki.vsm.SceneMaker4',
                'build' : versioning.info.build,
                'Build-Revision': versioning.info.commit,
                'Build-Date': new Date().format("yyyy-MM-dd HH:mm:ss"),
                'Full-Version': versioning.info.full,
                'Last-Tag': versioning.info.lastTag
        )
    }
}

// Run task to start the editor (SceneMaker4 - web-only)
task run(type: JavaExec) {
    group = 'application'
    description = 'Runs the VisualSceneMaker web editor'
    mainClass = 'de.dfki.vsm.SceneMaker4'
    systemProperty 'vsm.buildDate', new Date().format("yyyy-MM-dd HH:mm:ss")
    systemProperty 'vsm.buildRevision', versioning.info.commit
    systemProperty 'vsm.version', versioning.info.lastTag
    systemProperty 'vsm.build', versioning.info.build
    classpath = sourceSets.main.runtimeClasspath
    if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        jvmArgs(
                '-Xdock:name=VSM Web',
                "-Xdock:icon=${projectDir}/src/main/resources/app-icons/vsm-docicon.png",
                '-Dapple.awt.application.name=VSM Web',
                '-Dcom.apple.mrj.application.apple.menu.about.name=VSM Web'
        )
    }
}
