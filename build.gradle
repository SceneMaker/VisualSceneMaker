    }
}

// Headless semantic analysis of one or more projects — the corpus tool's entry point.
// No browser, no port bound: SemanticAnalyzeCli reuses WebUiServer's project loader and analysis
// pipeline without starting the server.
//
//   ./gradlew analyzeSemantics -PvsmProject=/path/to/ProjectDir
//   ./gradlew analyzeSemantics -PvsmProject=/a,/b -Ppersist=true -Planguage=en -PdaTr=true
//
// Uses the accurate transformer parser by default (see doc/parser-quality-plan.md): a corpus run is
// offline, so ~3x the per-sentence latency buys a better corpus. Override with
// -PudPackage=<name>, or -PudPackage= (empty) for the semantic-ud default.
//
// The property is deliberately NOT called -Pproject: that name is taken by Gradle's own Project
// object, so -Pproject= silently resolves to the root project instead of your path.
//
// Needs the UD service running for the basic layer:
//   ./gradlew :services:semantic-ud:startService
task analyzeSemantics(type: JavaExec) {
    group = 'application'
    description = 'Analyses project scripts semantically, headless. -PvsmProject=<dir>[,<dir>…] ' +
            '[-Ppersist=true] [-PdaTr=true] [-Planguage=de] [-Pdebug=true] [-PudPackage=<name>]'
    mainClass = 'de.dfki.vsm.web.SemanticAnalyzeCli'
    classpath = sourceSets.main.runtimeClasspath
    doFirst {
        if (!project.hasProperty('vsmProject')) {
            throw new GradleException(
                    'Missing -PvsmProject=<projectDir>. Example:\n' +
                    '  ./gradlew analyzeSemantics -PvsmProject=doc/IntakeInterview\n' +
                    '(note: -Pproject is reserved by Gradle and cannot be used here)')
        }
        def dirs = project.property('vsmProject').toString()
        def cliArgs = ["--project=${dirs}"]
        if (project.findProperty('persist')?.toString()?.toLowerCase() == 'true') cliArgs << '--persist'
        if (project.findProperty('daTr')?.toString()?.toLowerCase() == 'true') cliArgs << '--da-tr'
        if (project.findProperty('debug')?.toString()?.toLowerCase() == 'true') cliArgs << '--debug'
        if (project.hasProperty('language')) cliArgs << "--language=${project.property('language')}"
        if (project.hasProperty('udPackage')) cliArgs << "--ud-package=${project.property('udPackage')}"
        args = cliArgs
    }
}

// Extracts the behavior-command placement corpus as JSONL — plan Phase 2.1.
// Each record carries the whole decision an author faced: every candidate anchor slot (the negative
// examples) alongside the placements actually made, each resolved to a NEUROGES Function.
//
//   ./gradlew extractCorpus -PvsmProject=doc/IntakeInterview -Pout=build/corpus.jsonl -Pannotator=pg
//
// Needs the UD service running: ./gradlew :services:semantic-ud:startService
task extractCorpus(type: JavaExec) {
    group = 'application'
    description = 'Extracts the placement corpus to JSONL. -PvsmProject=<dir>[,<dir>…] -Pout=<file> ' +
            '[-Pannotator=<id>] [-Pscenario=<name>] [-Planguage=de]'
    mainClass = 'de.dfki.vsm.web.CorpusExtractCli'
    classpath = sourceSets.main.runtimeClasspath
    doFirst {
        if (!project.hasProperty('vsmProject') || !project.hasProperty('out')) {
            throw new GradleException(
                    'Missing -PvsmProject=<dir> and/or -Pout=<file.jsonl>. Example:\n' +
                    '  ./gradlew extractCorpus -PvsmProject=doc/IntakeInterview -Pout=build/corpus.jsonl')
        }
        def cliArgs = ["--project=${project.property('vsmProject')}",
                       "--out=${project.property('out')}"]
        if (project.hasProperty('annotator')) cliArgs << "--annotator=${project.property('annotator')}"
        if (project.hasProperty('scenario')) cliArgs << "--scenario=${project.property('scenario')}"
        if (project.hasProperty('language')) cliArgs << "--language=${project.property('language')}"
        args = cliArgs
    }
}

// Builds the semantic-ud image and warms a throwaway volume from empty, then asserts the service
// loads offline and parses. Manual-run-only and NOT part of `check`: it builds a torch image and
// downloads 1-2 GB, so it belongs in a deliberate run before deploying a parser change.
//
// Every deployment failure this service has had was a clean-state case a development machine hides
// — transformers missing from requirements but installed locally from other work, a model the
// fallback never downloaded but which was already cached, a shell string closed early by an
// apostrophe in a comment. This is the check that would have caught all three.
//
//   ./gradlew verifySemanticUdContainer
task verifySemanticUdContainer(type: Exec) {
    group = 'verification'
    description = 'Builds the semantic-ud image, warms a fresh volume and verifies an offline parse. ' +
            'Needs docker or podman; downloads 1-2 GB. Not part of check.'
    commandLine 'sh', 'services/semantic-ud/deploy/verify-container.sh'
}

// Leave-one-out evaluation of the placement model over a corpus — plan 3.5.
// Pure JSONL analysis, so no services need to be running.
//
//   ./gradlew placementEval -Pcorpus=build/corpus.jsonl
task placementEval(type: JavaExec) {
    group = 'verification'
    description = 'Leave-one-out evaluation of the behavior placement model. -Pcorpus=<corpus.jsonl>'
    mainClass = 'de.dfki.vsm.web.PlacementEvalCli'
    classpath = sourceSets.main.runtimeClasspath
    doFirst {
        if (!project.hasProperty('corpus')) {
            throw new GradleException(
                    'Missing -Pcorpus=<corpus.jsonl>. Example:\n' +
                    '  ./gradlew placementEval -Pcorpus=build/corpus.jsonl')
        }
        args = ["--corpus=${project.property('corpus')}"]
    }
}

// Reports over the extracted placement corpus — plan 2.4 (stats) and 2.3 (agreement).
// Pure JSONL analysis, so no services need to be running.
//
//   ./gradlew corpusStats     -Pcorpus=build/corpus.jsonl
//   ./gradlew corpusAgreement -Pcorpus=build/a.jsonl,build/b.jsonl
task corpusStats(type: Exec) {
    group = 'verification'
    description = 'Corpus statistics: Function x anchor-slot distribution and sparsity. -Pcorpus=<files>'
    doFirst {
        if (!project.hasProperty('corpus')) {
            throw new GradleException('Missing -Pcorpus=<file.jsonl>[,<file.jsonl>]')
        }
        commandLine(['python3', 'services/corpus/corpus_report.py', 'stats']
                + project.property('corpus').toString().split(',').toList())
    }
}

task corpusAgreement(type: Exec) {
    group = 'verification'
    description = 'Inter-annotator agreement on placement. GATES Phase 3. -Pcorpus=<files>'
    doFirst {
        if (!project.hasProperty('corpus')) {
            throw new GradleException('Missing -Pcorpus=<file.jsonl>[,<file.jsonl>]')
        }
        commandLine(['python3', 'services/corpus/corpus_report.py', 'agreement']
                + project.property('corpus').toString().split(',').toList())
    }
}

