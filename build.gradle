plugins {
    id 'java'
    id 'net.nemerosa.versioning' version '3.1.0'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}
javadoc { options.encoding = 'UTF-8' }

group 'de.dfki'
def resolvedVersionTag = versioning.info.lastTag
if (resolvedVersionTag == null || resolvedVersionTag.isBlank() || resolvedVersionTag == 'WebEditor_v0.1') {
    resolvedVersionTag = 'Web-v1.0'
}
allprojects {
    version = resolvedVersionTag
}


subprojects {
    plugins.withId('java') {
        def isJava17Module = project.path == ':core'
                || project.path == ':core-webserver'
                || project.path == ':core-http-jdk'
                || project.path == ':core-http-android'
                || project.path == ':core-logic-jpl'
                || project.path == ':runtime-server'
                || project.path.startsWith(':plugins:')
        if (!isJava17Module) {
            java {
                toolchain {
                    languageVersion = JavaLanguageVersion.of(21)
                }
            }
        }
        if (isJava17Module) {
            tasks.withType(JavaCompile).configureEach {
                options.release = 17
            }
        }
    }
}

repositories {
    mavenCentral()
    maven { url "https://repo.spring.io/libs-release" }
}

def appName = 'VSM Web'
def appIconPng = file('editor/src/main/resources/images/vsm_logo.png')
def appIconIcns = layout.buildDirectory.file('jpackage/VSM Web.icns')

dependencies {
    // https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter-api
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '5.3.2'
    testRuntimeOnly group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '5.3.2'
    testRuntimeOnly group: 'org.junit.platform', name: 'junit-platform-launcher', version: '1.3.2'
    implementation project(":core", {p->p.ext.flavor = "pc"; p.version = resolvedVersionTag})
    implementation project(":core-webserver")
    implementation project(":core-http-jdk")
    implementation project(":core-logic-jpl")
    implementation project(":editor")
    implementation fileTree(dir: 'lib', include: "*.jar")
    implementation project(":plugins:alma")
    implementation project(":plugins:AndroidGui")
    implementation project(":plugins:email")
    implementation project(":plugins:studymaster-web")
    implementation project(":plugins:fortunecookie")
    implementation project(":plugins:user-cue-service")
    implementation project(":plugins:decad")
    implementation project(":plugins:htmlgui-ws")
    implementation project(":plugins:odp")
    implementation project(":plugins:qrwebcam")
    implementation project(":plugins:unity")
    implementation project(":plugins:wizard")
    implementation project(":plugins:yallah")
    implementation project(":plugins:ssi")
    implementation project(":plugins:ssj")
    implementation project(":plugins:reeti")
    implementation project(":plugins:timer")
    implementation project(":plugins:tricatworld")
    implementation project(":plugins:charamel")
    implementation project(":plugins:charamel-ws")
    implementation project(":plugins:sockets")
    implementation project(":plugins:voicetts")
    implementation project(":plugins:DriveSimulator")
    implementation "io.javalin:javalin:4.6.8"
    implementation 'org.jetbrains:annotations:16.0.2'
    // https://mvnrepository.com/artifact/org.slick2d/slick2d-core
    implementation group: 'org.slick2d', name: 'slick2d-core', version: '1.0.2' // needed for documentation
    // https://mvnrepository.com/artifact/org.reflections/reflections
    implementation group: 'org.reflections', name: 'reflections', version: '0.9.12'
    // https://mvnrepository.com/artifact/jpl/jpl
    implementation group: 'jpl', name: 'jpl', version: '7.4.0'
    // https://mvnrepository.com/artifact/de.sciss/sphinx4
//    implementation group: 'de.dfki.mary', name: 'marytts-client', version: '5.1.2'
    // https://mvnrepository.com/artifact/net.java.dev.jna/jna
    implementation group: 'net.java.dev.jna', name: 'jna', version: '4.2.2'
    // https://mvnrepository.com/artifact/net.java.dev.jna/jna-platform
    implementation group: 'net.java.dev.jna', name: 'jna-platform', version: '4.2.2'
    // https://mvnrepository.com/artifact/com.1stleg/jnativehook
    implementation group: 'com.1stleg', name: 'jnativehook', version: '2.1.0'
    // https://mvnrepository.com/artifact/com.fifesoft/autocomplete
    implementation group: 'com.fifesoft', name: 'autocomplete', version: '2.0.5.1'
    // https://mvnrepository.com/artifact/math.geom2d/javaGeom
    implementation group: 'math.geom2d', name: 'javaGeom', version: '0.11.1'
    // https://mvnrepository.com/artifact/net.sourceforge.javaflacencoder/java-flac-encoder
    implementation group: 'net.sourceforge.javaflacencoder', name: 'java-flac-encoder', version: '0.3.7'
    // https://mvnrepository.com/artifact/org.json/json
    implementation group: 'org.json', name: 'json', version: '20171018'
    // https://mvnrepository.com/artifact/javax.xml.bind/jaxb-api
    implementation group: 'javax.xml.bind', name: 'jaxb-api', version: '2.4.0-b180830.0359'
    // https://mvnrepository.com/artifact/com.github.sarxos/webcam-capture
    implementation group: 'com.github.sarxos', name: 'webcam-capture', version: '0.3.12'
    // https://mvnrepository.com/artifact/com.google.zxing/core
    implementation group: 'com.google.zxing', name: 'core', version: '2.0'
    // https://mvnrepository.com/artifact/com.google.zxing/javase
    implementation group: 'com.google.zxing', name: 'javase', version: '2.0'
    // https://mvnrepository.com/artifact/org.slf4j/slf4j-api
    implementation group: 'org.slf4j', name: 'slf4j-api', version: '1.7.25'
    // https://mvnrepository.com/artifact/com.nativelibs4java/bridj
    implementation group: 'com.nativelibs4java', name: 'bridj', version: '0.7.0'
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withJavadocJar()
    withSourcesJar()
}

tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('editor/src/main/resources/images/vsm_logo.png') {
        into('app-icons')
        rename('vsm_logo.png', 'vsm-docicon.png')
    }
}

tasks.named('build') {
    dependsOn ':core-webserver:syncWebUi'
}

tasks.register('verifyPortableCore') {
    group = 'verification'
    description = 'Runs portability guard checks for the core module.'
    dependsOn ':core:verifyPortableCoreApis'
}

tasks.register('verifyAndroidPortable') {
    group = 'verification'
    description = 'Runs Android portability checks and compile gates for portable modules.'
    dependsOn 'verifyPortableCore'
    dependsOn ':core-http-android:verifyAndroidPortableApis'
    dependsOn ':plugins:AndroidGui:verifyAndroidPortableApis'
    dependsOn ':core:compileJava'
    dependsOn ':core-http-android:compileJava'
    dependsOn ':plugins:AndroidGui:compileJava'
}

tasks.register('generateIcns') {
    dependsOn tasks.jar
    outputs.file(appIconIcns)
    doLast {
        def iconsetDir = file("$buildDir/jpackage/VSM.iconset")
        iconsetDir.mkdirs()
        exec { commandLine 'sips', '-z', '16', '16', appIconPng, '--out', "${iconsetDir}/icon_16x16.png" }
        exec { commandLine 'sips', '-z', '32', '32', appIconPng, '--out', "${iconsetDir}/icon_16x16@2x.png" }
        exec { commandLine 'sips', '-z', '32', '32', appIconPng, '--out', "${iconsetDir}/icon_32x32.png" }
        exec { commandLine 'sips', '-z', '64', '64', appIconPng, '--out', "${iconsetDir}/icon_32x32@2x.png" }
        exec { commandLine 'sips', '-z', '128', '128', appIconPng, '--out', "${iconsetDir}/icon_128x128.png" }
        exec { commandLine 'sips', '-z', '256', '256', appIconPng, '--out', "${iconsetDir}/icon_128x128@2x.png" }
        exec { commandLine 'sips', '-z', '256', '256', appIconPng, '--out', "${iconsetDir}/icon_256x256.png" }
        exec { commandLine 'sips', '-z', '512', '512', appIconPng, '--out', "${iconsetDir}/icon_256x256@2x.png" }
        exec { commandLine 'sips', '-z', '512', '512', appIconPng, '--out', "${iconsetDir}/icon_512x512.png" }
        exec { commandLine 'sips', '-z', '1024', '1024', appIconPng, '--out', "${iconsetDir}/icon_512x512@2x.png" }
        exec { commandLine 'iconutil', '-c', 'icns', iconsetDir, '-o', appIconIcns.get().asFile }
    }
}

tasks.register('jpackageApp', Exec) {
    dependsOn tasks.jar
    dependsOn tasks.named('generateIcns')
    def jarFile = tasks.jar.archiveFile.get().asFile
    commandLine 'jpackage',
            '--type', 'app-image',
            '--name', appName,
            '--input', layout.buildDirectory.dir('libs').get().asFile.absolutePath,
            '--main-jar', jarFile.name,
            '--main-class', 'de.dfki.vsm.SceneMaker4',
            '--icon', appIconIcns.get().asFile.absolutePath,
            '--dest', layout.buildDirectory.dir('jpackage').get().asFile.absolutePath
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.register('compileServices') {
    group = 'build'
    description = 'Compile all services subprojects.'
    dependsOn(subprojects.findAll { it.path.startsWith(':services:') }.collect { it.path + ':compileJava' })
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    filter {
        setFailOnNoMatchingTests(false)
    }
}
def includeJavaFxRuntime = project.hasProperty("includeJavaFx") &&
        !"false".equalsIgnoreCase(project.property("includeJavaFx").toString())
def runtimeClasspathForJar = {
    def files = configurations.runtimeClasspath
    if (includeJavaFxRuntime) {
        return files
    }
    return files.filter { file ->
        if (file.isDirectory()) {
            return true
        }
        def name = file.name
        def lower = name.toLowerCase()
        return !(lower.startsWith("javafx-") || lower.contains("javafx") || name.contains("JFX"))
    }
}
jar {
    duplicatesStrategy = 'exclude'
    from {
            runtimeClasspathForJar().collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    archiveClassifier.set('plain')
    manifest {
        attributes(
                // Phase 8: Updated to SceneMaker4 (web-only, Swing removed)
                'Main-Class': 'de.dfki.vsm.SceneMaker4',
                'build' : versioning.info.build,
                'Build-Revision': versioning.info.commit,
                'Build-Date': new Date().format("yyyy-MM-dd HH:mm:ss"),
                'Full-Version': versioning.info.full,
                'Last-Tag': resolvedVersionTag
        )
    }
}

shadowJar {
    duplicatesStrategy = 'exclude'
    archiveClassifier.set('shadow')
    manifest {
        attributes(
                // Phase 8: Updated to SceneMaker4 (web-only, Swing removed)
                'Main-Class': 'de.dfki.vsm.SceneMaker4',
                'build' : versioning.info.build,
                'Build-Revision': versioning.info.commit,
                'Build-Date': new Date().format("yyyy-MM-dd HH:mm:ss"),
                'Full-Version': versioning.info.full,
                'Last-Tag': resolvedVersionTag
        )
    }
}

// Run task to start the editor (SceneMaker4 - web-only)
task run(type: JavaExec) {
    group = 'application'
    description = 'Runs the VisualSceneMaker web editor'
    mainClass = 'de.dfki.vsm.SceneMaker4'
    systemProperty 'vsm.buildDate', new Date().format("yyyy-MM-dd HH:mm:ss")
    systemProperty 'vsm.buildRevision', versioning.info.commit
    systemProperty 'vsm.version', resolvedVersionTag
    systemProperty 'vsm.build', versioning.info.build
    classpath = sourceSets.main.runtimeClasspath
    if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        jvmArgs(
                '-Xdock:name=VSM Web',
                "-Xdock:icon=${projectDir}/src/main/resources/app-icons/vsm-docicon.png",
                '-Dapple.awt.application.name=VSM Web',
                '-Dcom.apple.mrj.application.apple.menu.about.name=VSM Web'
        )
    }
}
