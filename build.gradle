// Stage: copy the fat jar to a clean directory, renamed to VisualSceneMaker.jar.
// jpackage bundles everything in --input as the app classpath.
def jpackageStagingDir = layout.buildDirectory.dir('jpackage-staging')
tasks.register('stageForJpackage', Copy) {
    dependsOn tasks.jar
    from(tasks.jar.archiveFile) { rename { 'VisualSceneMaker.jar' } }
    into jpackageStagingDir
}

// ── macOS .dmg ────────────────────────────────────────────────────────────────
tasks.register('jpackageMac', Exec) {
    group = 'distribution'
    description = 'Builds a macOS .dmg installer'
    dependsOn tasks.named('stageForJpackage')
    dependsOn tasks.named('generateIcns')
    def destDir = layout.buildDirectory.dir('installer').get().asFile
    doFirst { destDir.mkdirs() }
    def readmeFile = file('src/main/resources/installer/README.html')
    commandLine 'jpackage',
        '--type', 'dmg',
        '--name', appName,
        '--app-version', appVersion,
        '--vendor', appVendor,
        '--description', appDesc,
        '--input', jpackageStagingDir.get().asFile.absolutePath,
        '--main-jar', 'VisualSceneMaker.jar',
        '--main-class', 'de.dfki.vsm.SceneMaker4',
        '--icon', appIconIcns.get().asFile.absolutePath,
        '--java-options', '-Xmx512m',
        '--mac-dmg-content', readmeFile.absolutePath,
        '--dest', destDir.absolutePath
}

