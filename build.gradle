// ── Convenience alias: build the current platform's installer ─────────────────
tasks.register('packageInstaller') {
    group = 'distribution'
    description = 'Builds the native installer for the current platform (dmg / msi / deb)'
    def os = org.gradle.internal.os.OperatingSystem.current()
    if (os.isMacOsX()) {
        dependsOn tasks.named('jpackageMac')
    } else if (os.isWindows()) {
        dependsOn tasks.named('jpackageWindows')
    } else {
        dependsOn tasks.named('jpackageLinux')
    }
}

