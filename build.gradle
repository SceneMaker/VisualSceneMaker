plugins {
    id 'java'
    id 'net.nemerosa.versioning' version '3.1.0'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}
javadoc { options.encoding = 'UTF-8' }

group 'de.dfki'
allprojects {
    version = versioning.info.lastTag
}


subprojects {
    plugins.withId('java') {
        def isJava17Module = project.path == ':core' || project.path == ':runtime-server' || project.path.startsWith(':plugins:')
        if (!isJava17Module) {
            java {
                toolchain {
                    languageVersion = JavaLanguageVersion.of(21)
                }
            }
        }
        if (isJava17Module) {
            tasks.withType(JavaCompile).configureEach {
                options.release = 17
            }
        }
    }
}

repositories {
    mavenCentral()
    maven { url "https://repo.spring.io/libs-release" }
}

def appName = 'VSM Web'
def appIconPng = file('editor/src/main/resources/images/vsm_logo.png')
def appIconIcns = layout.buildDirectory.file('jpackage/VSM Web.icns')

