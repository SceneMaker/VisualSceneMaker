// macOS: generate .icns from the PNG logo (requires sips + iconutil, macOS only)
tasks.register('generateIcns') {
    inputs.file(appIconPng)
    outputs.file(appIconIcns)
    doLast {
        def iconsetDir = file("${buildDir}/jpackage/vsm.iconset")
        iconsetDir.mkdirs()
        [[16,'icon_16x16'], [32,'icon_16x16@2x'], [32,'icon_32x32'], [64,'icon_32x32@2x'],
         [128,'icon_128x128'], [256,'icon_128x128@2x'], [256,'icon_256x256'],
         [512,'icon_256x256@2x'], [512,'icon_512x512'], [1024,'icon_512x512@2x']].each { sz, name ->
            exec { commandLine 'sips', '-z', sz as String, sz as String, appIconPng, '--out', "${iconsetDir}/${name}.png" }
        }
        exec { commandLine 'iconutil', '-c', 'icns', iconsetDir, '-o', appIconIcns.get().asFile }
    }
}

