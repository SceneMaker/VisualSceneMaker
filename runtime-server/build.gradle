plugins {
    id 'java'
    id 'application'
}

group 'de.dfki.vsm'
version '1.0.0'

// Java 17 compatibility enforced by root build.gradle

repositories {
    mavenCentral()
}

dependencies {
    // Core runtime/model
    implementation project(':core')
    // Desktop webserver adapter module
    implementation project(':core-webserver')
    // Desktop logic adapter (JPL)
    implementation project(':core-logic-jpl')

    // Minimal plugins for runtime (optional, can be configured per deployment)
    implementation project(':plugins:timer')

    // SLF4J for Javalin logging
    implementation 'org.slf4j:slf4j-simple:2.0.17'
}

application {
    mainClass = 'de.dfki.vsm.runtime.RuntimeMain'
}

// The 'application' plugin adds a generic `run` task. An unqualified `./gradlew run` fans out to
// the `run` task in EVERY subproject, so it would also launch this server — colliding with the
// editor (root `:run`) or an adb-forwarded device on port 8091. Skip unless the task was requested
// by its qualified path (`./gradlew :runtime-server:run`).
tasks.named('run') {
    onlyIf {
        gradle.startParameter.taskNames.any { it == ':runtime-server:run' || it.endsWith('runtime-server:run') }
    }
}

jar {
    manifest {
        attributes(
            'Main-Class': 'de.dfki.vsm.runtime.RuntimeMain'
        )
    }

    // Create fat JAR with all dependencies
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = 'exclude'
}

// Task to create distribution
tasks.named('distZip') {
    archiveFileName = "runtime-server-${version}.zip"
}

tasks.named('distTar') {
    archiveFileName = "runtime-server-${version}.tar"
}
