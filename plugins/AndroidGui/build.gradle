plugins {
    id 'java'
}

group 'de.dfki'
version '4.0.1-android'


repositories {
    mavenCentral()
}

dependencies {
    testImplementation group: 'junit', name: 'junit', version: '4.12'
    implementation project(':core')
    implementation project(':core-http-android')
}

tasks.register('verifyAndroidPortableApis') {
    group = 'verification'
    description = 'Fails when AndroidGui uses desktop/server-only APIs.'

    doLast {
        def forbiddenImportPrefixes = [
                'java.awt.',
                'javax.swing.',
                'javafx.',
                'org.jpl7.',
                'io.javalin.',
                'org.reflections.',
                'java.net.http.',
                'javax.xml.bind.'
        ]
        def violations = []
        fileTree("${projectDir}/src/main/java").matching { include '**/*.java' }.files.each { file ->
            int lineNo = 0
            file.eachLine { line ->
                lineNo++
                def trimmed = line.trim()
                if (trimmed.startsWith('import ')) {
                    forbiddenImportPrefixes.each { prefix ->
                        if (trimmed.contains(prefix)) {
                            violations << "${file}:${lineNo}: forbidden import '${prefix}'"
                        }
                    }
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Android portability guard failed for AndroidGui:\n - "
                            + violations.join('\n - ')
            )
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyAndroidPortableApis')
}

jar {
    doFirst {
        project.ext.set('flavor', 'android')
        project.ext.set('buildInfo', 'android')
    }

    from {
        (configurations.runtimeClasspath).collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    manifest {
        attributes(
                'Main-Class': 'de.dfki.vsm.Core'

        )
    }
    duplicatesStrategy = 'exclude'
}
