plugins {
    id 'java'
}

group 'de.dfki'
version '4.0.1'

repositories {
    mavenCentral()
}


// Exclude the `node_modules` folder, which is possibly created by `npm` when building the React web app.
sourceSets {
    main {
        resources {
            exclude 'react-studymaster/node_modules/'
        }
    }
}

dependencies {
    testImplementation group: 'junit', name: 'junit', version: '4.12'
    implementation "io.javalin:javalin:6.7.0"
    implementation project(":core")
}
