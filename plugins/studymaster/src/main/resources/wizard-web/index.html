<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StudyMaster Wizard</title>
<style>
  :root {
    --bg: #f6f3ee;
    --panel: #ffffff;
    --panel-soft: #f5f7fb;
    --ink: #1f2328;
    --muted: #6b7280;
    --accent: #5b8edc;
    --accent-soft: #d6e2f6;
    --stroke: #e3ddd4;
    --button: #5b8edc;
    --button-pressed: #416aa6;
    --danger: #e26d5a;
    --danger-ink: #b4432b;
    --shadow: 0 16px 40px rgba(0,0,0,0.08);
    --shadow-soft: 0 8px 18px rgba(0,0,0,0.08);
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 16px;
    --radius-pill: 999px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Space Grotesk", "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px 64px;
  }
  .app { width: 100%; max-width: 760px; }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  header .logo { width: 40px; height: 40px; flex: none; }
  header h1 { font-size: 20px; margin: 0; }
  header .subtitle { color: var(--muted); font-size: 13px; margin-top: 2px; }
  header .titles { flex: 1; }

  .status-pill {
    font-size: 12px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: var(--radius-pill);
    background: var(--panel-soft);
    color: var(--muted);
    border: 1px solid var(--stroke);
    white-space: nowrap;
  }
  .status-pill.connecting { color: var(--muted); }
  .status-pill.connected { background: var(--accent-soft); color: var(--button-pressed); border-color: var(--accent); }
  .status-pill.error { background: #fbe9e6; color: var(--danger-ink); border-color: var(--danger); }

  .card {
    background: var(--panel);
    border: 1px solid var(--stroke);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-soft);
    padding: 22px 24px;
    margin-bottom: 20px;
  }

  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  input[type="text"], input[type="password"], input[type="number"], select {
    width: 100%;
    font: inherit;
    padding: 9px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--stroke);
    background: var(--panel);
    color: var(--ink);
  }
  input:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

  button {
    font: inherit;
    font-weight: 600;
    border: none;
    border-radius: var(--radius-sm);
    padding: 9px 16px;
    cursor: pointer;
  }
  .btn-primary { background: var(--button); color: #fff; }
  .btn-primary:hover { background: var(--button-pressed); }
  .btn-primary:disabled { background: var(--stroke); color: var(--muted); cursor: not-allowed; }
  .btn-ghost { background: var(--panel); color: var(--ink); border: 1px solid var(--stroke); }
  .btn-ghost:hover { background: var(--panel-soft); }

  .auth-row { display: flex; gap: 10px; align-items: flex-end; }
  .auth-row > div:first-child { flex: 1; }

  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 12px; }

  /* Active-node accent matches the SceneFlow editor's own "this node is active" styling
     (editor/web-ui/src/app.css .node-activity / .node-activity-border) so a wizard familiar
     with the editor recognizes it at a glance. */
  .flows-list { display: flex; flex-direction: column; gap: 14px; }
  .flow-card {
    border: 1px solid var(--stroke);
    border-left: 5px solid #e84a4f;
    border-radius: var(--radius-md);
    padding: 12px 14px;
    background: var(--panel-soft);
    position: relative;
    overflow: hidden;
  }
  .flow-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(232, 74, 79, 0.06);
    pointer-events: none;
    animation: flow-card-pulse 1.6s ease-in-out infinite alternate;
  }
  @keyframes flow-card-pulse { from { opacity: 0.4; } to { opacity: 1; } }
  .flow-card .flow-label {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: #e84a4f;
    margin-bottom: 6px;
  }
  /* node-trail: a running history of the nodes this flow has visited, most recent last — a
     comma-joined line, with the current (most recent) node bolded, and any scene turns spoken
     at a node breaking onto their own line right after that node's name. */
  .flow-card .node-trail { font-size: 15px; line-height: 1.7; }
  .flow-card .trail-node { color: var(--muted); font-weight: 500; cursor: default; }
  .flow-card .trail-node.current { color: var(--ink); font-weight: 700; }
  .flow-card .turn {
    margin: 4px 0 4px 0;
    background: #fff;
    border-radius: var(--radius-md);
    padding: 8px 12px;
    font-size: 14px;
  }
  .flow-card .turn .speaker { font-weight: 600; margin-right: 6px; }
  .now-playing .empty { color: var(--muted); font-size: 13px; }

  .request-banner {
    border: 1px solid var(--accent);
    background: var(--accent-soft);
    border-left: 5px solid var(--accent);
  }
  .request-banner .prompt { font-weight: 600; margin-bottom: 12px; }
  .request-banner .options { display: flex; flex-wrap: wrap; gap: 8px; }
  .request-banner .options button { background: #fff; border: 1px solid var(--accent); color: var(--button-pressed); }
  .request-banner .options button:hover { background: var(--accent); color: #fff; }
  .request-banner .free-input { display: flex; gap: 10px; }
  .request-banner .free-input > div:first-child { flex: 1; }

  .controls-list { display: flex; flex-direction: column; gap: 14px; }
  .control-row { display: flex; align-items: center; gap: 12px; }
  .control-row .control-label { flex: none; width: 160px; font-weight: 600; font-size: 13px; }
  .control-row .control-input { flex: 1; display: flex; gap: 8px; align-items: center; }
  .control-row .control-input input, .control-row .control-input select { flex: 1; }
  .toggle-btn { padding: 8px 14px; border-radius: var(--radius-pill); border: 1px solid var(--stroke); background: var(--panel); }
  .toggle-btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }

  .empty-state { color: var(--muted); font-size: 13px; }

  .log {
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 12px;
    color: var(--danger-ink);
  }
  .log div { padding: 4px 0; border-top: 1px solid var(--stroke); }
  .log div:first-child { border-top: none; }

  .asr-audio { width: 100%; }
  .asr-track {
    position: relative;
    height: 28px;
    margin-top: 12px;
    background: var(--panel-soft);
    border: 1px solid var(--stroke);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .asr-vad-bar { position: absolute; top: 0; bottom: 0; background: var(--accent); opacity: .55; }
  .asr-playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--danger); }
  .asr-transcript {
    margin-top: 12px;
    max-height: 220px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .asr-transcript-line { font-size: 13px; cursor: pointer; padding: 5px 8px; border-radius: 6px; }
  .asr-transcript-line:hover { background: var(--panel-soft); }
  .asr-transcript-time {
    font-family: "SFMono-Regular", Consolas, monospace;
    color: var(--muted);
    margin-right: 8px;
  }
</style>
</head>

    </div>

      <div id="asrTranscript" class="asr-transcript"></div>
      <div id="asrInputEmpty" class="empty-state" style="display:none;">No VAD/transcript info found for this recording.</div>
    </div>

      <div id="controlsList" class="controls-list"></div>
    </div>

  <div id="logArea" class="log"></div>

<script>
(function () {
  var ws = null;
  var controls = {};   // var -> {var,label,kind,options,min,max,value}
  var pendingRequest = null;
  var reconnecting = false;

  var statusPill = document.getElementById('statusPill');
  var authCard = document.getElementById('authCard');
  var authError = document.getElementById('authError');
  var keyInput = document.getElementById('keyInput');
  var connectBtn = document.getElementById('connectBtn');
  var mainArea = document.getElementById('mainArea');
  var flowsList = document.getElementById('flowsList');
  var requestCard = document.getElementById('requestCard');
  var requestPrompt = document.getElementById('requestPrompt');
  var requestControl = document.getElementById('requestControl');
  var controlsList = document.getElementById('controlsList');
  var logArea = document.getElementById('logArea');
  var asrInputCard = document.getElementById('asrInputCard');
  var asrAudio = document.getElementById('asrAudio');
  var asrTimeline = document.getElementById('asrTimeline');
  var asrTranscript = document.getElementById('asrTranscript');
  var asrInputEmpty = document.getElementById('asrInputEmpty');

  function setStatus(cls, text) {
    statusPill.className = 'status-pill ' + cls;
    statusPill.textContent = text;
  }

  function log(msg) {
    var div = document.createElement('div');
    div.textContent = new Date().toLocaleTimeString() + ' — ' + msg;
    logArea.insertBefore(div, logArea.firstChild);
    while (logArea.children.length > 20) logArea.removeChild(logArea.lastChild);
  }

  function wsUrl() {
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var base = location.pathname.endsWith('/') ? location.pathname : location.pathname + '/';
    return proto + '//' + location.host + base + 'ws';
  }

  function connect() {
    setStatus('connecting', 'connecting…');
    ws = new WebSocket(wsUrl());
    ws.onopen = function () {
      ws.send(JSON.stringify({ type: 'auth', key: keyInput.value }));
    };
    ws.onclose = function () {
      setStatus('error', 'disconnected');
      authCard.style.display = '';
      connectBtn.disabled = false;
      connectBtn.textContent = 'Connect';
      if (!reconnecting) log('Connection closed.');
    };
    ws.onerror = function () {
      setStatus('error', 'connection error');
    };
    ws.onmessage = function (evt) {
      var msg;
      try { msg = JSON.parse(evt.data); } catch (e) { return; }
      handleMessage(msg);
    };
  }

  connectBtn.addEventListener('click', function () {
    connectBtn.disabled = true;
    connectBtn.textContent = 'Connecting…';
    connect();
  });
  keyInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') connectBtn.click();
  });

  function handleMessage(msg) {
    switch (msg.type) {
      case 'authResult':
        if (msg.ok) {
          setStatus('connected', 'connected');
          authCard.style.display = 'none';
          mainArea.style.display = '';
          authError.textContent = '';
        } else {
          setStatus('error', 'auth failed');
          authError.textContent = 'Invalid key (' + (msg.reason || 'error') + ').';
          connectBtn.disabled = false;
          connectBtn.textContent = 'Connect';
        }
        break;
      case 'snapshot':
        applySnapshot(msg);
        break;
      case 'activeFlows':
        renderFlows(msg.flows || []);
        break;
      case 'variableChanged':
        if (controls[msg.var]) {
          controls[msg.var].value = msg.value;
          renderControls();
        }
        break;
      case 'request':
        pendingRequest = msg;
        renderRequest();
        break;
      case 'asrInput':
        loadAsrInput(msg);
        break;
      case 'requestCancelled':
        if (pendingRequest && pendingRequest.requestId === msg.requestId) {
          pendingRequest = null;
          renderRequest();
        }
        break;
      case 'runtimeStatus':
        log('Runtime status: ' + msg.status);
        break;
      case 'error':
        log('Error [' + msg.code + ']: ' + msg.message);
        break;
    }
  }

  function applySnapshot(snap) {
    controls = {};
    (snap.controls || []).forEach(function (c) { controls[c.var] = c; });
    renderControls();
    renderFlows(snap.flows || []);
    pendingRequest = (snap.pendingRequest && snap.pendingRequest !== null) ? snap.pendingRequest : null;
    renderRequest();
    loadAsrInput((snap.asrInput && snap.asrInput !== null) ? snap.asrInput : null);
  }

  // ---- Recorded-audio review (show_asrinput) --------------------------------------------------
  // Pushed by the studymaster plugin whenever the flow calls show_asrinput(var=<mp3 path>); the
  // mp3 and its <basename>.json sidecar (VAD + transcript events captured by the fast-asr server
  // during that recording) are served back at fixed URLs, always freshly (no-store + a cache-bust
  // query param) since there's only ever one "current" recording under those URLs.

  function assetUrl(relPath) {
    var base = location.pathname.endsWith('/') ? location.pathname : location.pathname + '/';
    var sep = relPath.indexOf('?') === -1 ? '?' : '&';
    return base + relPath + sep + 't=' + Date.now();
  }

  function loadAsrInput(payload) {
    if (!payload || !payload.mp3Url) {
      asrInputCard.style.display = 'none';
      return;
    }
    asrInputCard.style.display = '';
    asrTimeline.innerHTML = '';
    asrTranscript.innerHTML = '';
    asrInputEmpty.style.display = 'none';
    asrAudio.src = assetUrl(payload.mp3Url);
    asrAudio.load();

    if (!payload.jsonUrl) {
      asrInputEmpty.style.display = '';
      return;
    }
    fetch(assetUrl(payload.jsonUrl)).then(function (r) {
      if (!r.ok) throw new Error('status ' + r.status);
      return r.json();
    }).then(function (info) {
      renderAsrTimeline(info);
      renderAsrTranscript(info);
      seekToFirstSpeech(info);
    }).catch(function (e) {
      asrInputEmpty.style.display = '';
      log('Recording info unavailable: ' + e.message);
    });
  }

  // Auto-seeks the player to 250ms before the first detected speech onset, so the wizard doesn't
  // have to scrub past leading silence to hear what was actually said. Anchored on raw_active, not
  // the hysteresis-smoothed active flag: active is deliberately debounced to avoid flapping, so it
  // flips true a bit after speech actually starts (e.g. {active:false, raw_active:true,
  // speech_ratio:1.0} is already mid-onset) — raw_active catches the true onset, which is what a
  // "just before speech starts" seek target needs. Falls back to active for older sidecars that
  // predate raw_active.
  function seekToFirstSpeech(info) {
    var startS = (info.start_ms || 0) / 1000;
    var vad = info.vad || [];
    var firstSpeech = null;
    for (var i = 0; i < vad.length; i++) {
      var speaking = vad[i].raw_active !== undefined ? vad[i].raw_active : vad[i].active;
      if (speaking) { firstSpeech = vad[i]; break; }
    }
    if (!firstSpeech) return;
    var target = Math.max(0, (firstSpeech.ts - startS) - 0.25);
    var setCurrent = function () { try { asrAudio.currentTime = target; } catch (e) {} };
    if (asrAudio.readyState >= 1) setCurrent();
    else asrAudio.addEventListener('loadedmetadata', setCurrent, { once: true });
  }

  // VAD events arrive roughly every 30ms with an active/inactive flag; consecutive active=true
  // runs are grouped into bars (same idea as vsm-track's paired start/stop duration bars). All
  // timing is anchored on each event's absolute 'ts' (epoch seconds) rather than any per-utterance
  // start/end fields, since 'ts' is the one field every vad/asr event carries consistently.
  function renderAsrTimeline(info) {
    var startS = (info.start_ms || 0) / 1000;
    var duration = info.duration_s || 0;
    if (duration <= 0) return;
    var vad = info.vad || [];
    var bars = [];
    var runStart = null;
    vad.forEach(function (e) {
      var t = e.ts - startS;
      if (e.active && runStart === null) runStart = t;
      if (!e.active && runStart !== null) { bars.push([runStart, t]); runStart = null; }
    });
    if (runStart !== null) bars.push([runStart, duration]);

    var track = document.createElement('div');
    track.className = 'asr-track';
    bars.forEach(function (b) {
      var bar = document.createElement('div');
      bar.className = 'asr-vad-bar';
      bar.style.left = (100 * Math.max(0, b[0]) / duration) + '%';
      bar.style.width = (100 * Math.max(0, b[1] - b[0]) / duration) + '%';
      track.appendChild(bar);
    });
    var playhead = document.createElement('div');
    playhead.className = 'asr-playhead';
    track.appendChild(playhead);
    asrTimeline.appendChild(track);

    asrAudio.ontimeupdate = function () {
      var pct = Math.min(100, Math.max(0, 100 * asrAudio.currentTime / duration));
      playhead.style.left = pct + '%';
    };
  }

  // Only committed (is_final) transcript entries are listed — partials are transient re-tries of
  // the same utterance and would otherwise show as noisy duplicate lines.
  function renderAsrTranscript(info) {
    var startS = (info.start_ms || 0) / 1000;
    var finals = (info.transcript || []).filter(function (e) { return e.is_final; });
    if (finals.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'No committed transcript in this recording.';
      asrTranscript.appendChild(empty);
      return;
    }
    finals.forEach(function (e) {
      var t = Math.max(0, e.ts - startS);
      var line = document.createElement('div');
      line.className = 'asr-transcript-line';
      var time = document.createElement('span');
      time.className = 'asr-transcript-time';
      time.textContent = formatAsrTime(t);
      var text = document.createElement('span');
      text.textContent = e.accumulated || '';
      line.appendChild(time);
      line.appendChild(text);
      line.addEventListener('click', function () { asrAudio.currentTime = t; });
      asrTranscript.appendChild(line);
    });
  }

  function formatAsrTime(s) {
    var m = Math.floor(s / 60);
    var sec = (s - m * 60).toFixed(1);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  // One card per top-level flow — styled to match the SceneFlow editor's own "active node"
  // accent (see .flow-card in the stylesheet above) so a wizard familiar with the editor
  // recognizes what a highlighted node there means here too. Within a card, every node the
  // flow has visited so far is clustered into one comma-joined trail (most recent bolded);
  // a node that played a scene gets its spoken line(s) broken onto their own line right after
  // its name in the trail, and that stays visible even once the flow has moved on.
  function renderFlows(flows) {
    if (!flows || flows.length === 0) {
      flowsList.innerHTML = '<div class="empty">No flow active yet.</div>';
      return;
    }
    flowsList.innerHTML = '';
    flows.forEach(function (f) {
      var card = document.createElement('div');
      card.className = 'flow-card';

      var label = document.createElement('div');
      label.className = 'flow-label';
      label.textContent = f.flow || '';
      card.appendChild(label);

      var trail = document.createElement('div');
      trail.className = 'node-trail';
      var nodes = f.nodes || [];
      nodes.forEach(function (n, i) {
        var nameSpan = document.createElement('span');
        nameSpan.className = 'trail-node' + (i === nodes.length - 1 ? ' current' : '');
        nameSpan.textContent = n.name || n.id;
        if (n.comment) nameSpan.title = n.comment;
        trail.appendChild(nameSpan);
        if (i < nodes.length - 1) {
          trail.appendChild(document.createTextNode(', '));
        }
        (n.turns || []).forEach(function (t) {
          var turn = document.createElement('div');
          turn.className = 'turn';
          var speaker = document.createElement('span');
          speaker.className = 'speaker';
          speaker.textContent = (t.speaker || '') + ':';
          var text = document.createElement('span');
          text.textContent = t.text;
          turn.appendChild(speaker);
          turn.appendChild(text);
          trail.appendChild(turn);
        });
      });
      card.appendChild(trail);

      flowsList.appendChild(card);
    });
  }

  function sendSet(varName, value) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'set', var: varName, value: value }));
    }
  }

  function sendReply(requestId, value) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'reply', requestId: requestId, value: value }));
    }
    pendingRequest = null;
    renderRequest();
  }

  function renderRequest() {
    if (!pendingRequest) { requestCard.style.display = 'none'; return; }
    requestCard.style.display = '';
    requestPrompt.textContent = pendingRequest.prompt || ('Set ' + pendingRequest.var);
    requestControl.innerHTML = '';
    if (pendingRequest.kind === 'choice' && pendingRequest.options) {
      var wrap = document.createElement('div');
      wrap.className = 'options';
      pendingRequest.options.forEach(function (opt) {
        var btn = document.createElement('button');
        btn.textContent = opt;
        btn.addEventListener('click', function () { sendReply(pendingRequest.requestId, opt); });
        wrap.appendChild(btn);
      });
      requestControl.appendChild(wrap);
    } else if (pendingRequest.kind === 'boolean') {
      var wrap2 = document.createElement('div');
      wrap2.className = 'options';
      ['true', 'false'].forEach(function (v) {
        var btn = document.createElement('button');
        btn.textContent = v;
        btn.addEventListener('click', function () { sendReply(pendingRequest.requestId, v === 'true'); });
        wrap2.appendChild(btn);
      });
      requestControl.appendChild(wrap2);
    } else {
      var row = document.createElement('div');
      row.className = 'free-input';
      var inputWrap = document.createElement('div');
      var input = document.createElement('input');
      input.type = pendingRequest.kind === 'number' ? 'number' : 'text';
      inputWrap.appendChild(input);
      var btn = document.createElement('button');
      btn.className = 'btn-primary';
      btn.textContent = 'Submit';
      btn.addEventListener('click', function () {
        var v = pendingRequest.kind === 'number' ? Number(input.value) : input.value;
        sendReply(pendingRequest.requestId, v);
      });
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') btn.click(); });
      row.appendChild(inputWrap);
      row.appendChild(btn);
      requestControl.appendChild(row);
    }
  }

  function renderControls() {
    var keys = Object.keys(controls);
    if (keys.length === 0) {
      controlsList.innerHTML = '<div class="empty-state">No wizard-controllable variables declared (wizard-controls.json).</div>';
      return;
    }
    controlsList.innerHTML = '';
    keys.forEach(function (key) {
      var c = controls[key];
      var row = document.createElement('div');
      row.className = 'control-row';
      var label = document.createElement('div');
      label.className = 'control-label';
      label.textContent = c.label || c.var;
      row.appendChild(label);

      var inputWrap = document.createElement('div');
      inputWrap.className = 'control-input';

      if (c.kind === 'boolean') {
        var toggle = document.createElement('button');
        toggle.type = 'button';
        var isOn = c.value === true || c.value === 'true';
        toggle.className = 'toggle-btn' + (isOn ? ' on' : '');
        toggle.textContent = isOn ? 'On' : 'Off';
        toggle.addEventListener('click', function () {
          var next = !(c.value === true || c.value === 'true');
          c.value = next;
          sendSet(c.var, next);
          renderControls();
        });
        inputWrap.appendChild(toggle);
      } else if (c.kind === 'choice' && c.options) {
        var select = document.createElement('select');
        c.options.forEach(function (opt) {
          var o = document.createElement('option');
          o.value = opt; o.textContent = opt;
          if (c.value === opt) o.selected = true;
          select.appendChild(o);
        });
        select.addEventListener('change', function () {
          c.value = select.value;
          sendSet(c.var, select.value);
        });
        inputWrap.appendChild(select);
      } else if (c.kind === 'number') {
        var num = document.createElement('input');
        num.type = 'number';
        if (c.min !== undefined) num.min = c.min;
        if (c.max !== undefined) num.max = c.max;
        num.value = c.value !== null && c.value !== undefined ? c.value : '';
        num.addEventListener('change', function () {
          c.value = Number(num.value);
          sendSet(c.var, c.value);
        });
        inputWrap.appendChild(num);
      } else {
        var text = document.createElement('input');
        text.type = 'text';
        text.value = c.value !== null && c.value !== undefined ? c.value : '';
        text.addEventListener('change', function () {
          c.value = text.value;
          sendSet(c.var, text.value);
        });
        inputWrap.appendChild(text);
      }
      row.appendChild(inputWrap);
      controlsList.appendChild(row);
    });
  }

  connect();
})();
</script>
</body>
</html>
