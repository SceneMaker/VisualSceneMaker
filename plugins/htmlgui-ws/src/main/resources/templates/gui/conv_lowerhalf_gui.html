<!doctype html>
<html lang="en" class="h-100">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Conversation GUI</title>

    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/custom.css">
    <link rel="stylesheet" href="css/speech_bubbles.css">

    <script type="text/javascript" src="js/helper.js"></script>
</head>
<body style="overflow: hidden;">
<div id ="box">
<main class="content_quarter">
</main>
<main class="content_nearlyhalf" style="overflow: scroll;">
    <div class="row h-100" style="overflow: scroll;">
        <div class="col align-self-center" style="overflow: scroll;">
            <div class="d-flex flex-row small" style="overflow: scroll;">
                <!-- content start -->
                  <div id="chat" style="overflow: scroll;">
                  </div>
                <!-- content end -->
            </div>
        </div>
    </div>
</main>
<main class="highlighted">
    <div class="container-fluid h-100">
          <div class="row h-100">
            <div id='mic_on' class="position-absolute col-2 text-center">
               <i class="fas fa-microphone text-success" style="font-size:48px"></i>
            </div>
            <div id='mic_off' class="position-absolute col-2 text-center">
              <i class="fas fa-microphone-slash text-warning" style="font-size:48px"></i>
            </div>
            <div id='stop' class="col-12 align-middle text-right">
              <span><a onClick="parent.postMessage('stop', '*')">
                <i class="fas fa-chevron-circle-right text-danger" style="font-size:48px"></i></a></span>
            </div>
          </div>
    </div>
</main>
<footer class="footer">
    <div class="container-fluid h-100">
        <div class="row h-100">
            <div class="col">
                <a class="menu-button">
                    <span class="menu-icon" style="background-image: url('img/diary_highlight.png');"></span>
                </a>
            </div>
        </div>
    </div>
</footer>

</div>
</body>
</html>
