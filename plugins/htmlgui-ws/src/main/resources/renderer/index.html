<!--
  INFRASTRUCTURE FILE — DO NOT EDIT FOR CONTENT CUSTOMIZATION.

  This file is served directly from the plugin JAR at runtime. Any edits made
  here will have no effect because the JAR version always takes precedence.

  To customize what users see:
    - Define screens in your project's screens.json  (schema-driven, recommended)
    - Add custom HTML pages to your project's gui/   (legacy, full flexibility)
    - Add character-config.json to your project root to enable a virtual character layer

  Only change this file if you are modifying the plugin itself.
-->
<!doctype html>
<html lang="en" class="h-100">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Connect to plugin server (after DOM so audioOverlay element exists) -->
    <script defer type="text/javascript" src="js/wsclient.js"></script>

    <!-- Suppress the favicon 404; this iframe-hosting shell needs no icon. -->
    <link rel="icon" href="data:,">

    <!-- Self-contained shell: no external CSS (the schema screens render in their own iframe).
         Only the built-in audio overlay needs styling, done inline below. -->
    <style>
        html, body { height: 100%; margin: 0; }
        #audioOverlay {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.65);
        }
        #audioOverlay .panel {
            background: #fff; color: #000;
            padding: 1.25rem 1.5rem; border-radius: 14px;
            max-width: 520px; width: calc(100% - 2rem);
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
        }
        #audioOverlay .panel h3 { margin: 0 0 .5rem 0; font-size: 1.15rem; }
        #audioOverlay .panel p  { margin: 0 0 1rem 0; opacity: 0.85; }
        #enableAudioBtn { padding: .6rem 1rem; border: 0; border-radius: 10px; cursor: pointer;
                          background: #2563eb; color: #fff; font-size: 1rem; }
    </style>
</head>
<body>

<!-- Virtual character layer (z-index 0, behind screens).
     Hidden until character-config.json is found in the project root. -->
<iframe id="character" name="CHARACTER" src="" allow="autoplay; private-network-access" frameborder="0"
        style="display:none; position:fixed; left:0; top:0; z-index:0; width:100%; height:100%; border:none;"></iframe>

<!-- Schema-driven screen renderer (z-index 1, on top of character) -->
<iframe id="screens" name="SCREENS" src="/screens.html" allow="autoplay" frameborder="0"
        allowtransparency="true"
        style="position:fixed; left:0; top:0; z-index:1; width:100%; height:100%; border:none; background:transparent;"></iframe>

<!-- Audio-enable overlay (z-index 9999, wsclient.js hooks into this) -->
<div id="audioOverlay" role="dialog" aria-modal="true" aria-labelledby="audioOverlayTitle">
    <div class="panel">
        <h3 id="audioOverlayTitle">Enable audio</h3>
        <p>Chrome requires a user gesture before audio can start.</p>
        <button id="enableAudioBtn" class="btn btn-primary">Enable audio</button>
    </div>
</div>

<script>
    // Load the character through /character-proxy so the Vuppetmaster JS runs with
    // origin http://localhost. That makes ws://localhost:3030 a private→private
    // connection, bypassing Chrome's Private Network Access (PNA) restrictions.
    fetch('/character-config.json')
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(cfg) {
            if (!cfg || !cfg.url) return;
            var el = document.getElementById('character');
            try {
                var charUrl = new URL(cfg.url);
                var host = charUrl.hostname;
                if (host === 'localhost' || host === '127.0.0.1' || host === '[::1]') {
                    // Already a local origin (e.g. charamel-embed's self-hosted page): load directly.
                    // The proxy is only needed to relocate a PUBLIC character page onto localhost;
                    // proxying a local page would change the iframe's origin/port and break its
                    // own WebSocket (which connects via ws://location.host/ws).
                    el.src = cfg.url;
                } else {
                    var params = new URLSearchParams();
                    params.set('_src', charUrl.origin + charUrl.pathname);
                    charUrl.searchParams.forEach(function(v, k) { params.set(k, v); });
                    el.src = '/character-proxy?' + params.toString();
                }
            } catch (e) {
                // Fallback: load directly (PNA may still block for public origins)
                el.src = cfg.url;
            }
            el.style.display = '';
        })
        .catch(function() {});
</script>

</body>
</html>
