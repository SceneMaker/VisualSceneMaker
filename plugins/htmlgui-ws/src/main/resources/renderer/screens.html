<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VSM Screen</title>

    <!-- Shoelace component library (public CDN, no auth required) -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.19.1/cdn/themes/light.css">
    <script type="module"
            src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.19.1/cdn/shoelace.js"></script>

    <!-- VSM schema-driven renderer (Lit) -->
    <script type="module" src="/vsm-renderer.js"></script>

    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <vsm-screen-renderer></vsm-screen-renderer>
</body>
</html>
