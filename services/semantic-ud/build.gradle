plugins {
    id 'java'
}

group 'de.dfki.vsm'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.register('runService', Exec) {
    group = 'application'
    description = 'Run the semantic UD service (Python/Stanza).'
    dependsOn 'installRequirements'
    commandLine 'python3', 'server.py'
    workingDir project.projectDir
}

tasks.register('installRequirements', Exec) {
    group = 'application'
    description = 'Install Python requirements for semantic-ud.'
    commandLine 'python3', '-m', 'pip', 'install', '-r', 'requirements.txt'
    workingDir project.projectDir
}

tasks.register('startService', Exec) {
    group = 'application'
    description = 'Start the semantic UD service (alias of runService).'
    dependsOn 'installRequirements'
    commandLine 'python3', 'server.py'
    workingDir project.projectDir
}

tasks.register('evaluateMapping', Exec) {
    group = 'verification'
    description = 'Run UD mapping evaluation against references/eval-cases.json, using the parser ' +
            'package the product actually ships.'
    dependsOn 'installRequirements'
    environment 'SEMANTIC_UD_AUTO_DOWNLOAD', 'false'
    // Measure what we ship. Without this the eval would silently grade a parser the product no
    // longer uses. If the transformer's encoder is missing the service falls back and the harness
    // prints "Parser package measured: (stanza default)", which explains any resulting failure.
    environment 'SEMANTIC_UD_PACKAGE', System.getenv('SEMANTIC_UD_PACKAGE')
            ?: 'de:combined_german-nlp-electra'
    environment 'HF_HUB_OFFLINE', System.getenv('HF_HUB_OFFLINE') ?: '1'
    environment 'SEMANTIC_UD_RESOURCES_DIR', System.getenv('SEMANTIC_UD_RESOURCES_DIR') ?: "${System.getProperty('user.home')}/stanza_resources"
    commandLine 'python3', 'eval_harness.py', '--cases', 'references/eval-cases.json'
    workingDir project.projectDir
}
