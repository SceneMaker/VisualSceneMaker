plugins {
    id 'java'
}

group 'de.dfki.vsm'


if(!project.hasProperty('flavor')){
    apply plugin: 'java'
    version "android-4.0.1"
    project.ext.set('flavor', 'android')
    project.ext.set('buildInfo', 'android')

    println("Building jar for ANDROID")
}
compileJava{
   //options.release = 8
}
repositories {
    mavenCentral()
    maven { url "https://repo.spring.io/libs-release" }
}

dependencies {
    compileOnly group: 'com.github.vbmacher', name: 'java-cup-runtime', version: '11b-20160615'
    runtimeOnly group: 'com.github.vbmacher', name: 'java-cup-runtime', version: '11b-20160615'
    // https://mvnrepository.com/artifact/org.jetbrains/annotations
    implementation group: 'org.jetbrains', name: 'annotations', version: '17.0.0'
    // https://mvnrepository.com/artifact/org.json/json
    implementation group: 'org.json', name: 'json', version: '20240303'

}


jar {
    from {
        (configurations.runtimeClasspath).collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    manifest {
        attributes(
                'Main-Class': 'de.dfki.vsm.Core'

        )
    }
    duplicatesStrategy = 'exclude'
}

tasks.register('verifyPortableCoreApis') {
    group = 'verification'
    description = 'Fails when :core uses desktop/server-only APIs.'
    def sourceFiles = project.fileTree("${project.projectDir}/src/main/java") {
        include '**/*.java'
    }.files

    doLast {
        def forbiddenImportPrefixes = [
                'java.awt.',
                'javax.swing.',
                'javafx.',
                'org.jpl7.',
                'java.net.http.',
                'io.javalin.',
                'org.reflections.',
                'javax.xml.bind.'
        ]
        def forbiddenUsagePatterns = [
                'org.jpl7.',
                'java.net.http.',
                'io.javalin.',
                'org.reflections.'
        ]

        def violations = []
        sourceFiles.each { file ->
            int lineNo = 0
            file.eachLine { line ->
                lineNo++
                def trimmed = line.trim()
                if (trimmed.startsWith('import ')) {
                    forbiddenImportPrefixes.each { prefix ->
                        if (trimmed.contains(prefix)) {
                            violations << "${file}:${lineNo}: forbidden import '${prefix}'"
                        }
                    }
                }
                forbiddenUsagePatterns.each { pattern ->
                    if (line.contains(pattern)) {
                        violations << "${file}:${lineNo}: forbidden usage '${pattern}'"
                    }
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Core portability guard failed. Forbidden APIs found:\n - "
                            + violations.join('\n - ')
            )
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyPortableCoreApis')
}
